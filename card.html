<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校友卡 - 海林市高级中学校友（新海高人）</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: clamp(12px, 1vw, 18px); }
    body {
        font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #f0f0f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem;
    }
    .alumni-card {
        width: 100%;
        max-width: 58rem;
        height: 36rem;
        background: linear-gradient(135deg, #8a0609 0%, #a81114 50%, #7a0508 100%);
        border-radius: 1.5rem;
        position: relative;
        overflow: hidden;
        box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.4);
        display: flex;
        padding: 3rem;
        color: #ffffff;
    }
    .alumni-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-image: radial-gradient(circle at 15% 20%, rgba(255, 215, 215, 0.06) 0%, transparent 40%), radial-gradient(circle at 85% 85%, rgba(255, 215, 215, 0.04) 0%, transparent 40%);
        pointer-events: none;
    }
    .card-left-letters {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        transform: rotate(180deg);
        font-size: 2rem;
        letter-spacing: 0.4rem;
        color: rgba(255, 255, 255, 0.9);
        font-family: "Arial", sans-serif;
        font-weight: bold;
        padding-right: 2rem;
        border-right: 0.15rem solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
    }
    .card-main {
        flex: 1;
        padding-left: 2.5rem;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 1;
    }
    .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 3rem;
    }
    .card-brand {
        display: flex;
        align-items: center;
        gap: 1rem;
    }
    .card-brand .brand-logo {
        height: 5rem;
        width: 5rem;
        object-fit: contain;
        border-radius: 50%;
        background-color: rgba(255,255,255,0.1);
        border: 0.15rem solid rgba(255,255,255,0.3);
    }
    .card-brand .brand-text {
        display: flex;
        flex-direction: column;
    }
    .card-brand .brand-text .zh {
        font-size: 1.1rem;
        font-weight: normal;
        letter-spacing: 0.08rem;
        line-height: 1.3;
    }
    .card-brand .brand-text .en {
        font-size: 0.85rem;
        opacity: 0.9;
        letter-spacing: 0.04rem;
        margin-top: 0.2rem;
        font-family: "Arial", sans-serif;
    }
    .card-tag {
        background-color: #C8A063;
        color: #7a0508;
        font-size: 1.1rem;
        padding: 0.5rem 1.5rem;
        border-radius: 0.3rem;
        letter-spacing: 0.15rem;
        font-weight: normal;
    }
    .card-body {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex: 1;
    }
    .card-info {
        display: flex;
        flex-direction: column;
        gap: 1.8rem;
        padding-top: 0.5rem;
    }
    .card-info .name {
        font-size: 2.2rem;
        font-weight: normal;
        letter-spacing: 0.15rem;
        margin-bottom: 1rem;
    }
    .card-info .info-row {
        display: flex;
        align-items: baseline;
        gap: 1.5rem;
        font-size: 1.5rem;
    }
    .card-info .info-row .label {
        font-size: 1.4rem;
        color: rgba(255, 255, 255, 0.9);
        min-width: 7.5rem;
        letter-spacing: 0.1rem;
    }
    .card-info .info-row .value {
        font-size: 1.5rem;
        color: #ffffff;
        letter-spacing: 0.05rem;
    }
    .card-info .info-row .value.editable {
        cursor: pointer;
        border-bottom: 0.1rem dashed rgba(255,255,255,0.45);
        padding-bottom: 0.1rem;
    }
    .card-info .info-row .value.editable:hover {
        border-bottom-style: solid;
        border-bottom-color: #ffffff;
    }
    .card-photo {
        width: 12rem;
        height: 15rem;
        background-color: #ffffff;
        border-radius: 0.5rem;
        overflow: hidden;
        box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        cursor: pointer;
        position: relative;
    }
    .card-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .card-photo .photo-hint {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 0.85rem;
        text-align: center;
        padding: 0.4rem 0;
        display: none;
    }
    .card-photo:hover .photo-hint { display: block; }
    .card-photo.no-photo::after {
        content: '点击上传照片';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #999;
        font-size: 1.1rem;
        letter-spacing: 0.1rem;
    }
    .card-bottom {
        margin-top: auto;
        padding-top: 2rem;
    }
    .card-number {
        font-size: 2rem;
        font-family: "Arial", sans-serif;
        letter-spacing: 0.1rem;
        color: #ffffff;
        opacity: 0.95;
    }
    .card-photo-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.2rem;
        flex-shrink: 0;
    }
    .export-btn {
        font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        font-size: 1rem;
        color: #fff;
        background-color: #94070A;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 0.4rem;
        padding: 0.7rem 1.6rem;
        cursor: pointer;
        letter-spacing: 0.1rem;
    }
    .export-btn:hover { background-color: #a81114; }
</style>
  <link rel="icon" href="assets/favicon.png" />
</head>
<body>

<div class="alumni-card">
    <div class="card-left-letters">Alumni Card</div>
    <div class="card-main">
        <div class="card-top">
            <div class="card-brand">
                <img src="assets/haigao-logo.jpg" alt="海林市高级中学校友（新海高人）Logo" class="brand-logo">
                <div class="brand-text">
                    <span class="zh">海林市高级中学校友（新海高人）</span>
                    <span class="en">Hailin Senior High School Alumni Association</span>
                </div>
            </div>
            <div class="card-tag">校友卡</div>
        </div>
        <div class="card-body">
            <div class="card-info">
                <div class="name" id="cardName">—</div>
                <div class="info-row">
                    <span class="label">在校时间</span>
                    <span class="value" id="cardPeriod">—</span>
                </div>
                <div class="info-row">
                    <span class="label">所在地区</span>
                    <span class="value editable" id="cardRegion" title="点击修改所在地区">—</span>
                </div>
                <div class="info-row">
                    <span class="label">毕业学校</span>
                    <span class="value">海林市高级中学</span>
                </div>
            </div>
            <div class="card-photo-col">
                <div class="card-photo" id="cardPhotoBox">
                    <img src="" alt="校友照片" id="cardPhoto">
                    <span class="photo-hint">点击上传照片</span>
                </div>
                <button id="exportBtn" class="export-btn" type="button">领取校友电子卡</button>
            </div>
        </div>
        <div class="card-bottom">
            <div class="card-number" id="cardNumber">NO.————</div>
        </div>
    </div>
</div>

<input type="file" id="photoInput" accept="image/*" style="display:none">

<script>
    const API_BASE_URL = 'https://hailin-alumni-api.onrender.com';
    function readUser() {
        try {
            const raw = localStorage.getItem('alumniUser');
            return raw ? JSON.parse(raw) : null;
        } catch (e) {
            return null;
        }
    }
    function buildCardNumber(data) {
        if (data && data.cardNo && /^[0-9]+$/.test(String(data.cardNo)) && String(data.cardNo).length >= 13) return 'NO.' + String(data.cardNo).replace(/^NO\./i, '');
        const key = 'alumniCardNo';
        const cached = localStorage.getItem(key);
        if (cached && /^[0-9]+$/.test(cached) && cached.length >= 13) return 'NO.' + cached;
        const enroll = data.enrollYear || '';
        const year = data.graduateYear || '';
        const rand = String(Math.floor(10000 + Math.random() * 90000));
        const no = enroll + year + rand;
        if (no) localStorage.setItem(key, no);
        return 'NO.' + no;
    }
    const nameEl = document.getElementById('cardName');
    const periodEl = document.getElementById('cardPeriod');
    const regionEl = document.getElementById('cardRegion');
    const numberEl = document.getElementById('cardNumber');
    const photoEl = document.getElementById('cardPhoto');
    const photoBox = document.getElementById('cardPhotoBox');
    const photoInput = document.getElementById('photoInput');
    let currentName = '';
    let currentNo = 'NO.————';
    function applyCard(data) {
        const has = data && data.name;
        currentName = has ? data.name : '';
        nameEl.textContent = has ? data.name : '—';
        const enroll = has ? (data.enrollYear || '') : '';
        const grad = has ? (data.graduateYear || '') : '';
        periodEl.textContent = has ? (enroll && grad ? enroll + '-' + grad : (grad || '—')) : '—';
        regionEl.textContent = has ? (data.region || '—') : '—';
        currentNo = has ? buildCardNumber(data) : 'NO.————';
        numberEl.textContent = currentNo;
        if (has && currentNo && currentNo !== 'NO.————') {
            const token = localStorage.getItem('alumniToken');
            if (token) {
                fetch(API_BASE_URL + '/api/alumni/me', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ card_number: currentNo.replace(/^NO\./, '') })
                }).catch(() => {});
            }
        }
        if (has && data.photoUrl) {
            photoEl.src = data.photoUrl;
            photoEl.style.display = '';
            photoBox.classList.remove('no-photo');
        } else if (!photoEl.src) {
            photoEl.style.display = 'none';
            photoBox.classList.add('no-photo');
        }
    }
    function compressPhoto(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                const w = 480, h = 600;
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                const min = Math.min(img.width, img.height);
                const sx = (img.width - min) / 2, sy = (img.height - min) / 2;
                ctx.drawImage(img, sx, sy, min, min, 0, 0, w, h);
                URL.revokeObjectURL(url);
                resolve(canvas.toDataURL('image/jpeg', 0.88));
            };
            img.onerror = reject;
            img.src = url;
        });
    }
    photoBox.addEventListener('click', () => {
        if (!localStorage.getItem('alumniToken')) {
            alert('请先登录后再上传照片');
            location.href = 'login.html';
            return;
        }
        photoInput.click();
    });
    regionEl.addEventListener('click', async () => {
        const token = localStorage.getItem('alumniToken');
        if (!token) { alert('请先登录'); location.href = 'login.html'; return; }
        const cur = regionEl.textContent === '—' ? '' : regionEl.textContent;
        const input = prompt('修改所在地区', cur);
        if (input === null) return;
        const v = String(input).trim();
        if (!v) { alert('所在地区不能为空'); return; }
        try {
            const resp = await fetch(API_BASE_URL + '/api/alumni/me', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ current_city: v })
            });
            const r = await resp.json();
            if (resp.ok && r.profile) {
                regionEl.textContent = v;
                const local = readUser() || {};
                local.region = v;
                localStorage.setItem('alumniUser', JSON.stringify(local));
                alert('所在地区已更新');
            } else {
                alert(r.message || '更新失败，请重试');
            }
        } catch (err) {
            alert('网络异常，更新失败');
        }
    });
    photoInput.addEventListener('change', async () => {
        const file = photoInput.files[0];
        if (!file) return;
        const dataUrl = await compressPhoto(file);
        try {
            const resp = await fetch(API_BASE_URL + '/api/alumni/me', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('alumniToken') },
                body: JSON.stringify({ avatar_url: dataUrl })
            });
            const r = await resp.json();
            if (resp.ok && r.profile) {
                photoEl.src = dataUrl;
                photoEl.style.display = '';
                photoBox.classList.remove('no-photo');
                alert('照片已上传并同步');
            } else {
                alert(r.message || '照片上传失败，请先完成校友认证');
            }
        } catch (err) {
            alert('网络异常，照片上传失败');
        }
        photoInput.value = '';
    });
    /* 确保卡面信息已加载（避免导出默认占位内容） */
    async function ensureCardData() {
        if (currentName) return;
        const token = localStorage.getItem('alumniToken');
        const local = readUser() || {};
        if (token) {
            try {
                const resp = await fetch(API_BASE_URL + '/api/alumni/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await resp.json();
                if (resp.ok && (data.user || data.profile)) {
                    const u = data.user || {};
                    const p = data.profile || {};
                    const merged = {
                        name: u.display_name || p.name || local.name || '',
                        enrollYear: p.enrollment_year || u.enrollment_year || local.enrollYear || '',
                        graduateYear: p.graduation_year || u.graduation_year || local.graduateYear || '',
                        className: p.class_name || u.class_name || local.className || '',
                        region: p.current_city || p.city || u.current_city || local.region || '',
                        cardNo: u.card_number || '',
                        photoUrl: p.avatar_url || ''
                    };
                    localStorage.setItem('alumniUser', JSON.stringify(merged));
                    applyCard(merged);
                    return;
                }
            } catch (err) { /* 网络异常，继续用本地 */ }
        }
        if (local.name) applyCard(local);
    }
    /* 动态加载 html2canvas（jsDelivr 优先，cdnjs 备用） */
    function loadHtml2canvas() {
        return new Promise((res, rej) => {
            if (window.html2canvas) { res(); return; }
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
            s.onload = () => res();
            s.onerror = () => {
                const s2 = document.createElement('script');
                s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                s2.onload = () => res();
                s2.onerror = () => rej(new Error('html2canvas load failed'));
                document.head.appendChild(s2);
            };
            document.head.appendChild(s);
        });
    }
    document.getElementById('exportBtn').addEventListener('click', async () => {
        await ensureCardData();
        /* 导出前固定卡号：优先后端卡号，避免导出旧号/随机号 */
        const expTok = localStorage.getItem('alumniToken');
        if (expTok) {
            try {
                const resp = await fetch(API_BASE_URL + '/api/alumni/me', {
                    headers: { 'Authorization': 'Bearer ' + expTok }
                });
                const data = await resp.json();
                if (resp.ok && data.user && data.user.card_number && /^[0-9]+$/.test(String(data.user.card_number)) && String(data.user.card_number).length >= 13) {
                    currentNo = 'NO.' + data.user.card_number;
                    numberEl.textContent = currentNo;
                }
            } catch (e) { /* 后端不可达时用当前卡号 */ }
        }
        /* 截取页面卡面（所见即所得，校友看到的与导出图一致） */
        try {
            await loadHtml2canvas();
        } catch (e) {
            alert('截图组件加载失败，请检查网络后重试');
            return;
        }
        try {
            const cardEl = document.querySelector('.alumni-card');
            const canvas = await html2canvas(cardEl, {
                scale: 2,
                useCORS: true,
                backgroundColor: null,
                logging: false,
                onclone: (d) => {
                    /* 左侧竖排文字：逐字竖排（字母朝向正常），规避 html2canvas 对 writing-mode/rotate 的渲染偏差 */
                    const el = d.querySelector('.card-left-letters');
                    if (el) {
                        el.style.writingMode = 'horizontal-tb';
                        el.style.transform = 'none';
                        el.style.display = 'flex';
                        el.style.flexDirection = 'column';
                        el.style.alignItems = 'center';
                        el.style.justifyContent = 'center';
                        el.style.gap = '0.4rem';
                        const txt = el.textContent || '';
                        el.textContent = '';
                        const frag = d.createDocumentFragment();
                        for (const ch of txt) {
                            if (ch === ' ') continue;
                            const s = d.createElement('span');
                            s.textContent = ch;
                            s.style.display = 'block';
                            s.style.lineHeight = '1.2';
                            frag.appendChild(s);
                        }
                        el.appendChild(frag);
                    }
                }
            });
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = (currentName || '校友') + '校友卡.png';
            a.click();
        } catch (err) {
            alert('导出失败，请重试');
        }
    });
    (async () => {
        const token = localStorage.getItem('alumniToken');
        const local = readUser() || {};
        if (!token) { applyCard(local); return; }
        try {
            const resp = await fetch(API_BASE_URL + '/api/alumni/me', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await resp.json();
            if (resp.ok && (data.user || data.profile)) {
                const u = data.user || {};
                const p = data.profile || {};
                const merged = {
                    name: u.display_name || p.name || local.name || '',
                    enrollYear: p.enrollment_year || u.enrollment_year || local.enrollYear || '',
                    graduateYear: p.graduation_year || u.graduation_year || local.graduateYear || '',
                    className: p.class_name || u.class_name || local.className || '',
                    region: p.current_city || p.city || u.current_city || local.region || '',
                    cardNo: u.card_number || '',
                    photoUrl: p.avatar_url || ''
                };
                localStorage.setItem('alumniUser', JSON.stringify(merged));
                applyCard(merged);
                return;
            }
        } catch (err) { /* 网络异常时回退本地 */ }
        applyCard(local);
    })();
</script>

</body>
</html>
