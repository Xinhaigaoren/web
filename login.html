<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校友内网门户 - 海林市高级中学校友（新海高人）</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: clamp(11px, 1.05vw, 14px); }
    body {
        font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #94070A 0%, #c41e22 40%, #e85d5d 100%);
        min-height: 100vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: flex-start;
        padding: 3rem 2rem;
    }
    body::before {
        content: ''; position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        background-image: 
            radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(255,255,255,0.06) 0%, transparent 50%);
        pointer-events: none;
    }
    .login-header { display: flex; align-items: center; justify-content: center; gap: 1.2rem; margin: auto 0 2rem 0; position: relative; z-index: 1; }
    .login-header .logo-circle { height: 4.5rem; width: 4.5rem; object-fit: contain; border-radius: 50%; filter: drop-shadow(0 0.3rem 0.6rem rgba(0,0,0,0.3)); }
    .login-header .logo-text-area { display: flex; flex-direction: column; justify-content: center; color: #ffffff; white-space: nowrap; }
    .login-header .logo-text-area .zh { font-size: 1.35rem; font-weight: normal; line-height: 1.4; letter-spacing: 0.05rem; text-shadow: 0 0.2rem 0.5rem rgba(0,0,0,0.3); }
    .login-header .logo-text-area .en { font-size: 0.9rem; font-weight: normal; line-height: 1.4; margin-top: 0.2rem; opacity: 0.9; letter-spacing: 0.02rem; text-shadow: 0 0.2rem 0.5rem rgba(0,0,0,0.3); }
    .login-card { width: 100%; max-width: 36rem; background: linear-gradient(135deg, #fff5f5 0%, #ffe8e8 100%); border-radius: 1rem; box-shadow: 0 1.5rem 4rem rgba(0,0,0,0.3); padding: 2.5rem 3rem; position: relative; z-index: 1; }
    .lang-switch { position: absolute; top: 1rem; right: 1.2rem; display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; color: #94070A; text-decoration: none; }
    .lang-switch svg { width: 1.1rem; height: 1.1rem; fill: #94070A; }
    .login-title { text-align: center; font-size: 1.5rem; font-weight: normal; color: #94070A; margin-bottom: 0.8rem; }
    .sys-entry { color: inherit; text-decoration: none; cursor: pointer; transition: opacity 0.2s; }
    .sys-entry:hover { opacity: 0.75; text-decoration: underline; }
    .login-subtitle { text-align: center; font-size: 1.15rem; color: #94070A; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 0.6rem; font-weight: normal; }
    .login-subtitle .arrow-icon { width: 1.6rem; height: 1.6rem; fill: #94070A; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.95rem; color: #333; margin-bottom: 0.5rem; }
    .form-group input { width: 100%; padding: 0.85rem 1rem; font-size: 0.95rem; border: 1px solid #e0c8c0; border-radius: 0.3rem; outline: none; background-color: #ffffff; font-family: "Microsoft YaHei", "微软雅黑", sans-serif; }
    .form-group input:focus { border-color: #94070A; box-shadow: 0 0 0 0.2rem rgba(148,7,10,0.15); }
    .form-group input::placeholder { color: #b0b0b0; }
    .form-links { text-align: right; margin-top: 0.6rem; display: flex; justify-content: flex-end; align-items: center; gap: 0.6rem; }
    .form-links a { font-size: 0.95rem; color: #94070A; text-decoration: none; cursor: pointer; }
    .form-links a:hover { text-decoration: underline; }
    .form-links .link-divider { font-size: 0.85rem; color: #ccc; user-select: none; }
    .trust-browser { display: flex; align-items: flex-start; gap: 0.6rem; margin: 1rem 0; font-size: 0.85rem; color: #666; line-height: 1.6; }
    .trust-browser input[type="checkbox"] { margin-top: 0.25rem; accent-color: #94070A; transform: scale(1.2); }
    .login-btn { width: 100%; padding: 0.9rem; font-size: 1.05rem; font-weight: normal; color: #ffffff; background: linear-gradient(135deg, #94070A 0%, #c41e22 100%); border: none; border-radius: 0.5rem; cursor: pointer; letter-spacing: 0.15rem; font-family: "Microsoft YaHei", "微软雅黑", sans-serif; }
    .login-btn:hover { background: linear-gradient(135deg, #c41e22 0%, #94070A 100%); box-shadow: 0 0.5rem 1.5rem rgba(148,7,10,0.4); }
    .login-footer { margin: auto 0 0 0; display: flex; justify-content: center; align-items: center; font-size: 0.9rem; color: rgba(255,255,255,0.85); position: relative; z-index: 1; }
    .footer-contact { display: flex; align-items: center; gap: 0.5rem; }
    .footer-contact svg { width: 1.1rem; height: 1.1rem; fill: #fff; }
    .footer-contact a { color: rgba(255,255,255,0.85); text-decoration: none; }
</style>
  <link rel="icon" href="assets/favicon.png" />
</head>
<body>

<div class="login-header">
    <img src="assets/haigao-logo.jpg" alt="Logo" class="logo-circle">
    <div class="logo-text-area">
        <span class="zh">海林市高级中学校友（新海高人）</span>
        <span class="en">Hailin Senior High School Alumni Association</span>
    </div>
</div>

<div class="login-card">
    <a href="#" class="lang-switch">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        English
    </a>
    <h1 class="login-title">海林市高级中学校友（新海高人）</h1>
    <h2 class="login-title" style="font-size: 1.3rem; margin-bottom: 2.5rem;"><a href="user-electronic.html" class="sys-entry">用户电子身份服务系统</a></h2>
    <p class="login-subtitle">
        您即将登录
        <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        校友内网门户
    </p>
    <form autocomplete="off" id="loginForm">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" placeholder="用户名 / 电话号 / 校友电子卡号" autocomplete="off">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="密码" autocomplete="new-password">
            <div class="form-links">
                <a href="register.html">校友注册</a>
                <span class="link-divider">|</span>
                <a href="reset.html">忘记密码</a>
            </div>
        </div>
        <div class="trust-browser">
            <input type="checkbox" id="trustBrowser">
            <label for="trustBrowser">本次登录使用信任浏览器访问校友内网门户时不必再输入账号密码（统一登录），为了您的账号安全，使用完请关闭本浏览器。</label>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">登 录</button>
    </form>
</div>

<div class="login-footer">
    <div class="footer-contact">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        <a href="mailto:xinhaigaoren@126.com">xinhaigaoren@126.com</a>
    </div>
</div>

<script>
    const API_BASE_URL = 'https://hailin-alumni-api.onrender.com';
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) { alert('请输入用户名和密码'); return; }
        loginBtn.disabled = true;
        loginBtn.textContent = '登录中...';
        try {
            const resp = await fetch(API_BASE_URL + '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await resp.json();
            if (!resp.ok) { alert(data.message || '登录失败'); return; }
            localStorage.setItem('alumniToken', data.token);
            localStorage.setItem('alumniUser', JSON.stringify({
                name: data.user.name || '',
                phone: data.user.phone || '',
                email: data.user.email || '',
                role: data.user.role || '',
                status: data.user.status || ''
            }));
            location.href = 'member.html';
        } catch (err) {
            alert('网络异常，请稍后重试（' + err.message + '）');
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = '登 录';
        }
    });
</script>

</body>
</html>
