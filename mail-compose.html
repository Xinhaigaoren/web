<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写信 - 电子邮件系统</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 1vw; }
    body {
        font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #f4f4f4;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .topbar { width: 100%; height: 5.5rem; background-color: #94070A; display: flex; align-items: center; padding: 0 2rem; gap: 0.5rem; }
    .topbar-left { display: flex; align-items: center; gap: 0.8rem; white-space: nowrap; }
    .topbar-left img { height: 3rem; width: 3rem; border-radius: 50%; object-fit: contain; background-color: rgba(255,255,255,0.08); }
    .topbar-left .logo-text { display: flex; flex-direction: column; color: #fff; }
    .topbar-left .logo-text .zh { font-size: 1rem; line-height: 1.3; }
    .topbar-left .logo-text .en { font-size: 0.7rem; opacity: 0.85; line-height: 1.3; }
    .topbar-left .system-name-big { font-size: 1.8rem; color: #fff; font-weight: normal; letter-spacing: 0.05rem; margin-left: 1rem; }
    .topbar-spacer { flex: 1; }
    .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; }
    .topbar-tools { display: flex; align-items: center; gap: 1.2rem; color: #fff; font-size: 0.9rem; white-space: nowrap; }
    .topbar-tools a { color: #fff; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; opacity: 0.9; transition: opacity 0.3s; }
    .topbar-tools a:hover { opacity: 1; }
    .topbar-menu { display: flex; align-items: center; gap: 1.8rem; font-size: 1.3rem; color: #fff; white-space: nowrap; }
    .topbar-menu a { color: #fff; text-decoration: none; position: relative; padding-bottom: 0.3rem; border-bottom: 1px solid transparent; opacity: 0.92; transition: border-color 0.3s, opacity 0.3s; }
    .topbar-menu a:hover { border-bottom-color: #fff; opacity: 1; }
    .topbar-menu a.active { opacity: 1; }
    .main-layout { flex: 1; display: flex; background-color: #ffffff; }
    .sidebar { width: 12rem; background-color: #f5f5f5; border-right: 1px solid #e0e0e0; padding: 1rem 0; display: flex; flex-direction: column; }
    .sidebar-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1rem; font-size: 0.9rem; color: #333; text-decoration: none; border-left: 3px solid transparent; transition: all 0.3s; }
    .sidebar-btn:hover { background-color: #ebebeb; color: #94070A; }
    .sidebar-btn.active { background-color: #ffffff; border-left-color: #94070A; color: #94070A; font-weight: bold; }
    .sidebar-btn svg { width: 1rem; height: 1rem; fill: currentColor; }
    .content-area { flex: 1; padding: 1.5rem 2rem; overflow-y: auto; background: #fff; }

    .compose-form { width: 100%; }
    .compose-actions { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem; }
    .btn-send { background: #94070A; color: #fff; border: none; padding: 0.55rem 1.6rem; font-size: 1rem; border-radius: 0.25rem; cursor: pointer; font-family: inherit; }
    .btn-send:hover { background: #7a0609; }
    .btn-plain { background: #fff; color: #333; border: 1px solid #d0d0d0; padding: 0.5rem 1.2rem; font-size: 0.9rem; border-radius: 0.25rem; cursor: pointer; font-family: inherit; }
    .btn-plain:hover { border-color: #94070A; color: #94070A; }
    .compose-row { display: flex; align-items: center; border-bottom: 1px solid #eee; padding: 0.55rem 0; font-size: 0.95rem; }
    .compose-row label { width: 5.5rem; color: #666; flex-shrink: 0; }
    .compose-row input { flex: 1; border: none; outline: none; font-size: 0.95rem; font-family: inherit; color: #333; background: transparent; }
    .compose-toolbar { display: flex; align-items: center; gap: 0.4rem; padding: 0.6rem 0; border-bottom: 1px solid #eee; flex-wrap: wrap; }
    .compose-toolbar button { background: #fff; border: 1px solid #e0e0e0; border-radius: 0.2rem; padding: 0.3rem 0.7rem; font-size: 0.85rem; color: #444; cursor: pointer; font-family: inherit; }
    .compose-toolbar button:hover { border-color: #94070A; color: #94070A; }
    .compose-toolbar select { padding: 0.3rem 0.5rem; font-size: 0.85rem; border: 1px solid #e0e0e0; border-radius: 0.2rem; color: #444; background: #fff; }
    .compose-body { width: 100%; min-height: clamp(280px, 55vh, 560px); border: none; outline: none; resize: vertical; padding: 1rem 0; font-size: 1rem; line-height: 1.7; font-family: inherit; }
    .compose-footer { display: flex; align-items: center; gap: 1.4rem; padding-top: 0.8rem; font-size: 0.9rem; color: #555; flex-wrap: wrap; }
    .compose-footer label { display: flex; align-items: center; gap: 0.3rem; cursor: pointer; }
    .compose-footer input[type=checkbox] { accent-color: #94070A; }
    .toast { position: fixed; top: 6rem; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 0.6rem 1.4rem; border-radius: 0.3rem; font-size: 0.9rem; z-index: 99; display: none; }

    /* ========== 浏览器适配 ========== */
    @media (max-width: 1280px) {
        .topbar { height: 5rem; padding: 0 1.4rem; }
        .topbar-menu { font-size: 1.2rem; gap: 1.4rem; }
        .system-name-big { font-size: 1.6rem; }
        .sidebar { width: 11rem; }
    }
    @media (max-width: 1024px) {
        .topbar { height: 4.6rem; }
        .topbar-menu { font-size: 1.05rem; gap: 1rem; }
        .topbar-left .logo-text .en { display: none; }
        .sidebar { width: 10rem; }
        .content-area { padding: 1rem 1.2rem; }
    }
    @media (max-width: 820px) {
        .topbar { flex-wrap: wrap; height: auto; padding: 0.6rem 1rem; gap: 0.4rem; }
        .topbar-right { flex: 1; min-width: 0; align-items: stretch; }
        .topbar-menu { font-size: 0.95rem; gap: 0.8rem; flex-wrap: wrap; }
        .topbar-tools { font-size: 0.8rem; gap: 0.8rem; }
        .system-name-big { font-size: 1.3rem; }
        .main-layout { flex-direction: column; }
        .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid #e0e0e0; padding: 0.5rem; }
        .sidebar-btn { padding: 0.5rem 0.8rem; border-left: none; border-bottom: 2px solid transparent; }
        .sidebar-btn.active { border-bottom-color: #94070A; border-left: none; }
    }
</style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left">
        <img src="assets/haigao-logo.jpg" alt="Logo">
        <div class="logo-text">
            <span class="zh">海林市高级中学校友（新海高人）</span>
            <span class="en">Hailin Senior High School Alumni Association</span>
        </div>
        <span class="system-name-big">电子邮件系统</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-right">
        <div class="topbar-tools">
            <a href="member.html">内网系统</a>
            <a href="index.html">校友官网</a>
        </div>
        <nav class="topbar-menu">
            <a href="mail-inbox.html">收件箱</a>
            <a href="mail-sent.html">已发送</a>
            <a href="mail-drafts.html">草稿箱</a>
            <a href="mail-compose.html" class="active">写信</a>
            <a href="mail-todo.html">待办邮件</a>
            <a href="mail-contact.html">其他文件夹</a>
        </nav>
    </div>
</header>

<div class="main-layout">
    <aside class="sidebar">
        <a href="mail-compose.html" class="sidebar-btn active">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg>
            写信
        </a>
        <a href="mail-inbox.html" class="sidebar-btn inbox">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/></svg>
            收件箱
        </a>
        <a href="mail-todo.html" class="sidebar-btn todo">
            <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            待办邮件
        </a>
        <a href="mail-drafts.html" class="sidebar-btn drafts">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            草稿箱
        </a>
        <a href="mail-sent.html" class="sidebar-btn sent">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            已发送
        </a>
        <a href="mail-contact.html" class="sidebar-btn">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            联系人
        </a>
        <a href="mail-contact.html" class="sidebar-btn">其他文件夹</a>
    </aside>

    <section class="content-area">
        <div class="compose-form">
            <div class="compose-actions">
                <button class="btn-send" id="sendBtn">发送</button>
                <button class="btn-plain" id="draftBtn">存草稿</button>
                <button class="btn-plain" id="previewBtn">预览</button>
                <button class="btn-plain" id="cancelBtn">取消</button>
            </div>

            <div class="compose-row">
                <label>发件人：</label>
                <input type="text" id="fromInput" readonly>
            </div>
            <div class="compose-row">
                <label>收件人：</label>
                <input type="text" id="toInput" placeholder="输入校友邮箱，多个用逗号分隔">
            </div>
            <div class="compose-row">
                <label>抄送：</label>
                <input type="text" id="ccInput" placeholder="可选，多个用逗号分隔">
            </div>
            <div class="compose-row">
                <label>主题：</label>
                <input type="text" id="subjectInput" placeholder="">
            </div>

            <div class="compose-toolbar">
                <button type="button" onclick="return false;">↶ 撤销</button>
                <button type="button" onclick="return false;">↷ 重做</button>
                <button type="button" onclick="return false;">📎 添加附件</button>
                <select><option>正文</option></select>
                <select><option>五号</option></select>
                <button type="button" onclick="return false;"><b>B</b></button>
                <button type="button" onclick="return false;"><i>I</i></button>
                <button type="button" onclick="return false;"><u>U</u></button>
                <span style="flex:1"></span>
            </div>

            <textarea class="compose-body" id="bodyInput" placeholder=""></textarea>

            <div class="compose-footer">
                <label><input type="checkbox" id="urgentCb"> 设为“紧急”</label>
                <label><input type="checkbox" id="receiptCb" checked> 已读回执</label>
            </div>
        </div>
    </section>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
    var API = 'https://hailin-alumni-api.onrender.com';
    function getToken(){ return localStorage.getItem('alumniToken') || ''; }
    if (!getToken()) { location.href = 'login.html?redirect=mail-compose.html'; return; }

    var toast = document.getElementById('toast');
    function showToast(t){ toast.textContent = t; toast.style.display = 'block'; clearTimeout(showToast._t); showToast._t = setTimeout(function(){ toast.style.display = 'none'; }, 2600); }

    // 当前编辑的草稿 id（从 ?draft= 读取）
    var editingDraftId = null;
    try {
        var q = new URLSearchParams(location.search);
        if (q.get('draft')) editingDraftId = Number(q.get('draft'));
    } catch (e) {}

    function collectForm(){
        var toRaw = document.getElementById('toInput').value.trim();
        var to = toRaw ? toRaw.split(/[,，;；]/).map(function(s){ return s.trim(); }).filter(Boolean) : [];
        var ccRaw = document.getElementById('ccInput').value.trim();
        var cc = ccRaw ? ccRaw.split(/[,，;；]/).map(function(s){ return s.trim(); }).filter(Boolean) : [];
        return {
            to: to, cc: cc,
            subject: document.getElementById('subjectInput').value.trim(),
            body: document.getElementById('bodyInput').value,
            priority: document.getElementById('urgentCb').checked ? 'urgent' : 'normal',
            read_receipt: document.getElementById('receiptCb').checked
        };
    }
    function saveDraft(andThen){
        var payload = collectForm();
        payload.draft_id = editingDraftId || undefined;
        var btn = document.getElementById('draftBtn');
        if (btn) btn.disabled = true;
        fetch(API + '/api/mail/drafts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
            body: JSON.stringify(payload)
        })
        .then(function(r){ return r.json(); })
        .then(function(j){
            if (btn) btn.disabled = false;
            if (!j.ok) { showToast(j.message || '保存草稿失败'); return; }
            editingDraftId = j.draft_id;
            showToast('草稿已保存');
            if (andThen) andThen();
        })
        .catch(function(){ if (btn) btn.disabled = false; showToast('网络异常，保存失败'); });
    }
    // 编辑草稿：加载内容
    if (editingDraftId) {
        fetch(API + '/api/mail/drafts/' + editingDraftId, { headers: { 'Authorization': 'Bearer ' + getToken() } })
            .then(function(r){ return r.json(); })
            .then(function(j){
                if (!j.ok || !j.draft) return;
                var d = j.draft;
                document.getElementById('toInput').value = (d.to || []).join(', ');
                document.getElementById('ccInput').value = (d.cc || []).join(', ');
                document.getElementById('subjectInput').value = d.subject || '';
                document.getElementById('bodyInput').value = d.body || '';
                document.getElementById('urgentCb').checked = d.priority === 'urgent';
                document.getElementById('receiptCb').checked = d.read_receipt !== false;
            })
            .catch(function(){});
    }
    document.getElementById('draftBtn').addEventListener('click', function(){ saveDraft(); });

    // 读取发件人地址
    fetch(API + '/api/mail/account', { headers: { 'Authorization': 'Bearer ' + getToken() } })
        .then(function(r){ return r.json(); })
        .then(function(j){ if (j.ok && j.account) document.getElementById('fromInput').value = j.account.mail_address; })
        .catch(function(){});

    document.getElementById('sendBtn').addEventListener('click', function(){
        var toRaw = document.getElementById('toInput').value.trim();
        if (!toRaw) { showToast('请填写收件人'); return; }
        var to = toRaw.split(/[,，;；]/).map(function(s){ return s.trim(); }).filter(Boolean);
        var ccRaw = document.getElementById('ccInput').value.trim();
        var cc = ccRaw ? ccRaw.split(/[,，;；]/).map(function(s){ return s.trim(); }).filter(Boolean) : [];
        var payload = {
            to: to,
            cc: cc,
            subject: document.getElementById('subjectInput').value.trim(),
            body: document.getElementById('bodyInput').value,
            priority: document.getElementById('urgentCb').checked ? 'urgent' : 'normal',
            read_receipt: document.getElementById('receiptCb').checked
        };
        var btn = document.getElementById('sendBtn');
        btn.disabled = true;
        fetch(API + '/api/mail/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
            body: JSON.stringify(payload)
        })
        .then(function(r){ return r.json(); })
        .then(function(j){
            btn.disabled = false;
            if (!j.ok) { showToast(j.message || '发送失败'); return; }
            if (editingDraftId) { try { fetch(API + '/api/mail/drafts/' + editingDraftId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + getToken() } }); } catch(e){} }
            showToast('邮件已发送');
            setTimeout(function(){ location.href = 'mail-sent.html'; }, 900);
        })
        .catch(function(){ btn.disabled = false; showToast('网络异常，发送失败'); });
    });

    document.getElementById('previewBtn').addEventListener('click', function(){
        var subj = document.getElementById('subjectInput').value.trim() || '（无主题）';
        var body = document.getElementById('bodyInput').value || '（空）';
        alert('主题：' + subj + '\n\n' + body.slice(0, 500));
    });

    document.getElementById('cancelBtn').addEventListener('click', function(){
        location.href = 'mail-inbox.html';
    });
})();
</script>
</body>
</html>
