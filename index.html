<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>海林市高级中学校友（新海高人）</title>
    <meta name="description" content="海林市高级中学校友（新海高人）官网首页" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%2394070A'/><text x='50' y='50' fill='white' font-size='52' font-family='Microsoft YaHei' text-anchor='middle' dominant-baseline='central'>海</text></svg>" />
    <style>
        /* ==========================================
           全局等比缩放 + 基础复位
           ========================================== */
        html { font-size: 1.25vw; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif;
            background-color: #111;
        }

        /* ==========================================
           全屏轮播区（仅此部分）
           ========================================== */
        .hero-slider {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 45rem;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1s ease;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .slide.active { opacity: 1; }

        /* ★★★ 请替换下面 4 行 background-image 的 url 为真实图片（1920×1080 及以上，16:9） ★★★
           当前为 SVG 占位色块（不会裂图）；替换示例：
           .slide-1 { background-image: url('assets/slide-1.jpg'); }
           .slide-2 { background-image: url('https://你的图片地址/2.jpg'); } */
        .slide-1 {
            background-image: url('data:image/svg+xml;charset=utf-8,<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="%238a0609"/><text x="800" y="450" fill="rgba(255,255,255,0.85)" font-size="72" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="middle">Slide 1</text></svg>');
        }
        .slide-2 {
            background-image: url('data:image/svg+xml;charset=utf-8,<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="%231a3a5c"/><text x="800" y="450" fill="rgba(255,255,255,0.85)" font-size="72" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="middle">Slide 2</text></svg>');
        }
        .slide-3 {
            background-image: url('data:image/svg+xml;charset=utf-8,<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="%234a2c1a"/><text x="800" y="450" fill="rgba(255,255,255,0.85)" font-size="72" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="middle">Slide 3</text></svg>');
        }
        .slide-4 {
            background-image: url('data:image/svg+xml;charset=utf-8,<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="%232c1a4a"/><text x="800" y="450" fill="rgba(255,255,255,0.85)" font-size="72" font-family="Microsoft YaHei, sans-serif" text-anchor="middle" dominant-baseline="middle">Slide 4</text></svg>');
        }

        /* 左下角文字 */
        .bottom-left-text {
            position: absolute;
            bottom: 3rem;
            left: 5rem;
            color: #ffffff;
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            font-size: 1.6rem;
            font-weight: normal;
            letter-spacing: 0.15rem;
            text-shadow: 0 0.3rem 0.6rem rgba(0, 0, 0, 0.7);
            white-space: nowrap;
            z-index: 5;
            pointer-events: none;
        }

        /* 右下角 6 个圆点 */
        .slider-indicators {
            position: absolute;
            bottom: 3rem;
            right: 5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 5;
        }
        .dot-btn {
            width: 1.2rem;
            height: 1.2rem;
            border-radius: 50%;
            border: 0.15rem solid rgba(255, 255, 255, 0.85);
            background-color: transparent;
            cursor: pointer;
            transition: all 0.3s;
            padding: 0;
        }
        .dot-btn:hover { border-color: #ffffff; }
        .dot-btn.active {
            background-color: #ffffff;
            border-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- ==========================================
         全屏轮播区
         ========================================== -->
    <section class="hero-slider">
        <div class="slide slide-1 active"></div>
        <div class="slide slide-2"></div>
        <div class="slide slide-3"></div>
        <div class="slide slide-4"></div>

        <!-- 左下角文字 -->
        <div class="bottom-left-text">三年风雨同舟 归来仍是少年</div>

        <!-- 右下角 6 个圆点（前 4 点对应 4 张图，第 5/6 点循环回到第 1/2 张） -->
        <div class="slider-indicators">
            <button class="dot-btn active" data-index="0" aria-label="第 1 张"></button>
            <button class="dot-btn" data-index="1" aria-label="第 2 张"></button>
            <button class="dot-btn" data-index="2" aria-label="第 3 张"></button>
            <button class="dot-btn" data-index="3" aria-label="第 4 张"></button>
            <button class="dot-btn" data-index="4" aria-label="第 5 张"></button>
            <button class="dot-btn" data-index="5" aria-label="第 6 张"></button>
        </div>
    </section>

    <script>
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot-btn');
        let currentIndex = 0;

        function showSlide(index) {
            const realIndex = index % slides.length; /* 6 点循环对应 4 图 */
            slides.forEach((s, i) => s.classList.toggle('active', i === realIndex));
            dots.forEach((d, i) => d.classList.toggle('active', i === realIndex));
            currentIndex = realIndex;
        }

        dots.forEach((dot, i) => {
            dot.addEventListener('click', () => showSlide(i));
        });
    </script>
</body>
</html>
