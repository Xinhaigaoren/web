<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人通讯录 - 电子邮件系统</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 1vw; }
    body {
        font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #f4f4f4;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .topbar { width: 100%; height: 5.5rem; background-color: #94070A; display: flex; align-items: center; padding: 0 2rem; gap: 0.5rem; }
    .topbar-left { display: flex; align-items: center; gap: 0.8rem; white-space: nowrap; }
    .topbar-left img { height: 3rem; width: 3rem; border-radius: 50%; object-fit: contain; background-color: rgba(255,255,255,0.08); }
    .topbar-left .logo-text { display: flex; flex-direction: column; color: #fff; }
    .topbar-left .logo-text .zh { font-size: 1rem; line-height: 1.3; }
    .topbar-left .logo-text .en { font-size: 0.7rem; opacity: 0.85; line-height: 1.3; }
    .topbar-left .system-name-big { font-size: 1.8rem; color: #fff; font-weight: normal; letter-spacing: 0.05rem; margin-left: 1rem; }
    .topbar-spacer { flex: 1; }
    .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; }
    .topbar-tools { display: flex; align-items: center; gap: 1.2rem; color: #fff; font-size: 0.9rem; white-space: nowrap; }
    .topbar-tools a { color: #fff; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; opacity: 0.9; transition: opacity 0.3s; }
    .topbar-tools a:hover { opacity: 1; }
    .topbar-menu { display: flex; align-items: center; gap: 1.8rem; font-size: 1.3rem; color: #fff; white-space: nowrap; }
    .topbar-menu a { color: #fff; text-decoration: none; position: relative; padding-bottom: 0.3rem; border-bottom: 1px solid transparent; opacity: 0.92; transition: border-color 0.3s, opacity 0.3s; }
    .topbar-menu a:hover { border-bottom-color: #fff; opacity: 1; }
    .topbar-menu a.active { opacity: 1; }
    .main-layout { flex: 1; display: flex; background-color: #ffffff; }
    .sidebar { width: 12rem; background-color: #f5f5f5; border-right: 1px solid #e0e0e0; padding: 1rem 0; display: flex; flex-direction: column; }
    .sidebar-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1rem; font-size: 0.9rem; color: #333; text-decoration: none; border-left: 3px solid transparent; transition: all 0.3s; }
    .sidebar-btn:hover { background-color: #ebebeb; color: #94070A; }
    .sidebar-btn.active { background-color: #ffffff; border-left-color: #94070A; color: #94070A; font-weight: bold; }
    .sidebar-btn svg { width: 1rem; height: 1rem; fill: currentColor; }

    .content-area { flex: 1; padding: 0; overflow: hidden; background: #fff; display: flex; }

    /* ===== 通讯录内部布局：左侧分组树 + 右侧列表 ===== */
    .contacts-wrap { flex: 1; display: flex; min-width: 0; }
    .group-panel { width: 11rem; flex-shrink: 0; background: #fafbfc; border-right: 1px solid #e4e7eb; display: flex; flex-direction: column; }
    .group-scroll { flex: 1; overflow-y: auto; padding: 0.8rem 0; }
    .group-item { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1rem; font-size: 0.88rem; color: #333; cursor: pointer; }
    .group-item:hover { background: #f0f2f5; }
    .group-item.active { background: #e8f0fe; color: #94070A; font-weight: bold; }
    .group-item .cnt { color: #999; font-size: 0.8rem; }
    .group-item.active .cnt { color: #94070A; }
    .group-divider { height: 1px; background: #e4e7eb; margin: 0.5rem 0; }
    .group-actions { border-top: 1px solid #e4e7eb; padding: 0.6rem 0.8rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .group-actions a { display: block; font-size: 0.85rem; color: #445; text-decoration: none; padding: 0.4rem 0.6rem; border-radius: 0.2rem; cursor: pointer; }
    .group-actions a:hover { background: #eef1f4; color: #94070A; }

    .contact-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .contact-toolbar { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 1.2rem; border-bottom: 1px solid #e4e7eb; flex-wrap: wrap; }
    .tb-more { font-size: 0.88rem; color: #555; cursor: pointer; padding: 0.3rem 0.6rem; border: 1px solid #e0e0e0; border-radius: 0.2rem; background: #fff; font-family: inherit; }
    .tb-more:hover { border-color: #94070A; color: #94070A; }
    .tb-search { flex: 1; min-width: 10rem; display: flex; align-items: center; border: 1px solid #d5d9de; border-radius: 0.25rem; padding: 0.35rem 0.6rem; background: #fff; }
    .tb-search input { flex: 1; border: none; outline: none; font-size: 0.88rem; font-family: inherit; color: #333; background: transparent; }
    .tb-search svg { width: 1rem; height: 1rem; fill: #999; margin-right: 0.4rem; flex-shrink: 0; }
    .tb-pager { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #666; }
    .tb-pager button { background: #fff; border: 1px solid #d5d9de; border-radius: 0.2rem; width: 1.6rem; height: 1.6rem; cursor: pointer; font-size: 0.85rem; color: #444; font-family: inherit; }
    .tb-pager button:hover:not(:disabled) { border-color: #94070A; color: #94070A; }
    .tb-pager button:disabled { opacity: 0.4; cursor: default; }

    .contact-title { padding: 0.8rem 1.2rem 0.4rem; font-size: 1rem; color: #333; font-weight: normal; }
    .contact-title .count { color: #999; font-size: 0.85rem; margin-left: 0.3rem; }

    .contact-table { width: 100%; border-collapse: collapse; }
    .contact-table th { text-align: left; padding: 0.5rem 1.2rem; font-size: 0.82rem; color: #666; font-weight: normal; border-bottom: 1px solid #e4e7eb; background: #fafbfc; }
    .contact-table td { padding: 0.55rem 1.2rem; font-size: 0.88rem; border-bottom: 1px solid #f0f2f5; color: #333; }
    .contact-table tr:hover td { background-color: #fafbfc; }
    .contact-table .name { font-weight: bold; }
    .contact-table .email { color: #0a8043; }
    .contact-table .phone { color: #666; }
    .contact-table .op a { color: #999; font-size: 0.8rem; cursor: pointer; text-decoration: underline; margin-right: 0.6rem; }
    .contact-table .op a:hover { color: #94070A; }
    .contact-scroll { flex: 1; overflow-y: auto; }
    .empty-tip { text-align: center; color: #999; padding: 3rem 0; font-size: 0.9rem; }

    /* ===== 新建联系组弹窗（图二样式） ===== */
    .group-modal-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.35); z-index: 97; display: none; align-items: center; justify-content: center; }
    .group-modal { background: #fff; border-radius: 0.35rem; width: 30rem; max-width: 92vw; box-shadow: 0 8px 30px rgba(0,0,0,0.2); overflow: hidden; }
    .group-modal .gm-top { display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 1rem; background: #f7f8fa; border-bottom: 1px solid #e4e7eb; }
    .gm-top .btn-ok { background: #9E0B0F; color: #fff; border: none; padding: 0.35rem 1.2rem; font-size: 0.85rem; border-radius: 0.2rem; cursor: pointer; font-family: inherit; }
    .gm-top .btn-ok:hover { background: #7d090c; }
    .gm-top .btn-cancel { background: #fff; color: #555; border: 1px solid #d5d9de; padding: 0.35rem 1.2rem; font-size: 0.85rem; border-radius: 0.2rem; cursor: pointer; font-family: inherit; }
    .gm-top .btn-cancel:hover { border-color: #94070A; color: #94070A; }
    .group-modal .gm-body { padding: 1.2rem 1.4rem; }
    .gm-body h3 { font-size: 1.05rem; color: #333; font-weight: normal; margin-bottom: 1rem; }
    .gm-row { display: flex; align-items: center; margin-bottom: 1rem; }
    .gm-row label { width: 6rem; color: #444; font-size: 0.9rem; flex-shrink: 0; }
    .gm-row .req { color: #e5484d; font-size: 0.85rem; margin-left: 0.2rem; }
    .gm-row input { flex: 1; border: 1px solid #d5d9de; border-radius: 0.25rem; padding: 0.45rem 0.6rem; font-size: 0.9rem; font-family: inherit; outline: none; }
    .gm-row input:focus { border-color: #3b7cff; }
    .gm-sub { font-size: 0.9rem; color: #333; margin-bottom: 0.5rem; }
    .gm-link { font-size: 0.9rem; color: #3b7cff; cursor: pointer; }

    /* ===== 新建联系人弹窗 ===== */
    .modal-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.35); z-index: 98; display: none; align-items: center; justify-content: center; }
    .modal { background: #fff; border-radius: 0.35rem; width: 26rem; max-width: 92vw; padding: 1.3rem 1.5rem; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
    .modal h3 { font-size: 1.05rem; color: #333; font-weight: normal; margin-bottom: 1rem; }
    .modal .field { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.8rem; }
    .modal .field label { width: 5rem; color: #666; font-size: 0.9rem; flex-shrink: 0; }
    .modal .field input, .modal .field select { flex: 1; border: 1px solid #d5d9de; border-radius: 0.25rem; padding: 0.45rem 0.6rem; font-size: 0.9rem; font-family: inherit; outline: none; }
    .modal .field input:focus, .modal .field select:focus { border-color: #3b7cff; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1rem; }
    .modal-actions button { padding: 0.45rem 1.2rem; font-size: 0.9rem; border-radius: 0.2rem; cursor: pointer; font-family: inherit; }
    .modal-actions .btn-ok { background: #9E0B0F; color: #fff; border: none; }
    .modal-actions .btn-ok:hover { background: #7d090c; }
    .modal-actions .btn-cancel { background: #fff; border: 1px solid #d5d9de; color: #333; }
    .modal-actions .btn-cancel:hover { border-color: #94070A; color: #94070A; }

    /* ===== 通讯录管理视图（图三样式） ===== */
    .manage-view { flex: 1; display: none; flex-direction: column; min-width: 0; }
    .manage-view.show { display: flex; }
    .manage-top { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem 1.2rem; border-bottom: 1px solid #e4e7eb; }
    .manage-top a { font-size: 0.9rem; color: #3b7cff; cursor: pointer; text-decoration: none; }
    .manage-top a:hover { text-decoration: underline; }
    .manage-title { padding: 0.9rem 1.2rem; font-size: 1rem; color: #333; }
    .manage-title .count { color: #999; font-size: 0.85rem; }
    .manage-table { width: 100%; border-collapse: collapse; }
    .manage-table th { text-align: left; padding: 0.5rem 1.2rem; font-size: 0.82rem; color: #666; font-weight: normal; border-bottom: 1px solid #e4e7eb; background: #fafbfc; }
    .manage-table td { padding: 0.6rem 1.2rem; font-size: 0.88rem; border-bottom: 1px solid #f0f2f5; }
    .manage-table tr:hover td { background-color: #fafbfc; }
    .manage-table .gname { font-weight: bold; color: #333; }
    .manage-table .op { text-align: right; white-space: nowrap; }
    .manage-table .op a { color: #3b7cff; font-size: 0.85rem; cursor: pointer; text-decoration: none; margin-left: 1rem; }
    .manage-table .op a.danger { color: #e5484d; }
    .manage-table .op a:hover { text-decoration: underline; }

    .toast { position: fixed; top: 6rem; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 0.6rem 1.4rem; border-radius: 0.3rem; font-size: 0.9rem; z-index: 99; display: none; }

    /* ========== 浏览器适配 ========== */
    @media (max-width: 1280px) {
        .topbar { height: 5rem; padding: 0 1.4rem; }
        .topbar-menu { font-size: 1.2rem; gap: 1.4rem; }
        .system-name-big { font-size: 1.6rem; }
        .sidebar { width: 11rem; }
        .group-panel { width: 10rem; }
    }
    @media (max-width: 1024px) {
        .topbar { height: 4.6rem; }
        .topbar-menu { font-size: 1.05rem; gap: 1rem; }
        .topbar-left .logo-text .en { display: none; }
        .sidebar { width: 10rem; }
        .group-panel { width: 9.5rem; }
    }
    @media (max-width: 820px) {
        .topbar { flex-wrap: wrap; height: auto; padding: 0.6rem 1rem; gap: 0.4rem; }
        .topbar-right { flex: 1; min-width: 0; align-items: stretch; }
        .topbar-menu { font-size: 0.95rem; gap: 0.8rem; flex-wrap: wrap; }
        .topbar-tools { font-size: 0.8rem; gap: 0.8rem; }
        .system-name-big { font-size: 1.3rem; }
        .main-layout { flex-direction: column; }
        .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid #e0e0e0; padding: 0.5rem; }
        .sidebar-btn { padding: 0.5rem 0.8rem; border-left: none; border-bottom: 2px solid transparent; }
        .sidebar-btn.active { border-bottom-color: #94070A; border-left: none; }
        .content-area { flex-direction: column; }
        .contacts-wrap { flex-direction: column; }
        .group-panel { width: 100%; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid #e4e7eb; align-items: center; }
        .group-scroll { display: flex; flex-wrap: wrap; padding: 0.4rem; }
        .group-item { padding: 0.4rem 0.7rem; }
        .group-divider { display: none; }
        .group-actions { flex-direction: row; border-top: none; border-left: 1px solid #e4e7eb; }
        .contact-main { width: 100%; }
    }
</style>
</head>
<body>

    <div class="topbar-left">
        <img src="assets/haigao-logo.jpg" alt="Logo">

            <span class="zh">海林市高级中学校友（新海高人）</span>

        <div class="topbar-tools">

        </div>
        <nav class="topbar-menu">

<div class="main-layout">
    <aside class="sidebar">
        <a href="mail-compose.html" class="sidebar-btn">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg>
            写信
        </a>
        <a href="mail-inbox.html" class="sidebar-btn inbox">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/></svg>
            收件箱
        </a>
        <a href="mail-todo.html" class="sidebar-btn todo">
            <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            待办邮件
        </a>
        <a href="mail-drafts.html" class="sidebar-btn drafts">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            草稿箱
        </a>
        <a href="mail-sent.html" class="sidebar-btn sent">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            已发送
        </a>
        <a href="mail-contact.html" class="sidebar-btn active">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            联系人
        </a>
        <a href="mail-contact.html" class="sidebar-btn">其他文件夹</a>
    </aside>

    <section class="content-area">
        <!-- ===== 通讯录主视图 ===== -->
        <div class="contacts-wrap" id="contactsWrap">
            <aside class="group-panel">
                <div class="group-scroll" id="groupTree"></div>
                <div class="group-actions">
                    <a id="newGroupBtn">新建联系组</a>
                    <a id="newContactBtn">新建联系人</a>
                    <a id="manageBtn">通讯录管理</a>

            <div class="contact-main">
                <div class="contact-toolbar">
                    <button class="tb-more" id="moreBtn">更多</button>
                    <div class="tb-search">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <input type="text" id="searchInput" placeholder="搜索联系人">
                    </div>
                    <div class="tb-pager">
                        <span id="pageTip">1/1</span>
                        <button id="prevBtn">‹</button>
                        <button id="nextBtn">›</button>
                    </div>
                </div>
                <div class="contact-title">所有联系人<span class="count" id="countTip"></span></div>
                <div class="contact-scroll">
                    <table class="contact-table">
                        <thead><tr><th>姓名</th><th>邮件地址</th><th>手机</th><th style="width:6rem;"></th></tr></thead>

            <div class="contact-scroll">

<!-- 新建联系组弹窗（图二样式） -->
<div class="group-modal-mask" id="modalGroup">
    <div class="group-modal">
        <div class="gm-top">
            <button class="btn-ok" id="gSave">确定</button>
            <button class="btn-cancel" id="gCancel">取消</button>

        <div class="gm-body">

<!-- 新建联系人弹窗 -->
<div class="modal-mask" id="modalContact">

        <h3>新建联系人</h3>
        <div class="field"><label>姓名：</label><input type="text" id="cName" placeholder="必填"></div>
        <div class="field"><label>邮箱：</label><input type="text" id="cEmail" placeholder="如 xx@qq.com"></div>
        <div class="field"><label>手机：</label><input type="text" id="cPhone"></div>
        <div class="field"><label>联系组：</label><select id="cGroup"><option value="">未分组联系人</option></select></div>
        <div class="modal-actions">
            <button class="btn-cancel" id="cCancel">取消</button>
            <button class="btn-ok" id="cSave">保存</button>

<div class="toast" id="toast"></div>

<script>
(function(){
    var API = 'https://hailin-alumni-api.onrender.com';
    function getToken(){ return localStorage.getItem('alumniToken') || ''; }
    if (!getToken()) { location.href = 'login.html?redirect=mail-contact.html'; return; }

    var toast = document.getElementById('toast');
    function showToast(t){ toast.textContent = t; toast.style.display = 'block'; clearTimeout(showToast._t); showToast._t = setTimeout(function(){ toast.style.display = 'none'; }, 2400); }
    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }

    // 全局状态
    var allContacts = [];          // [{id,name,email,phone,group,isAlumni}]
    var groups = [];               // [{name,count}]
    var curGroup = '__all__';      // '__all__' | '__alumni__' | groupName | '__ungrouped__'
    var curSearch = '';
    var curPage = 1;
    var PAGE_SIZE = 20;

    // ===== 数据加载 =====
    function loadAll(){
        loadGroups();
        loadContacts();
    }
    function loadGroups(){
        fetch(API + '/api/mail/contact-groups', { headers: { 'Authorization': 'Bearer ' + getToken() } })
            .then(function(r){ return r.json(); })
            .then(function(j){
                if (!j.ok) return;
                groups = j.groups || [];
                renderTree();
                // 更新新建联系人分组下拉
                var sel = document.getElementById('cGroup');
                var cur = sel.value;
                sel.innerHTML = '<option value="">未分组联系人</option>';
                groups.forEach(function(g){ if (g.name !== '未分组联系人') { var o = document.createElement('option'); o.value = g.name; o.textContent = g.name; sel.appendChild(o); } });
                if (cur) sel.value = cur;
            })
            .catch(function(){});
    }
    function loadContacts(){
        fetch(API + '/api/mail/contacts', { headers: { 'Authorization': 'Bearer ' + getToken() } })
            .then(function(r){ return r.json(); })
            .then(function(j){
                if (!j.ok) { showToast(j.message || '加载失败'); return; }
                var alumni = (j.alumni || []).map(function(a){ return { name: a.name, email: a.email, phone: '', group: '已认证校友', isAlumni: true }; });
                var personal = (j.personal || []).map(function(c){ return { id: c.id, name: c.name, email: c.email, phone: c.phone, group: c.group_name || '未分组联系人', isAlumni: false }; });
                allContacts = alumni.concat(personal);
                renderTable();
                renderTree();
            })
            .catch(function(){ showToast('网络异常，请稍后重试'); });
    }

    // ===== 分组树渲染 =====
    function renderTree(){
        var tree = document.getElementById('groupTree');
        tree.innerHTML = '';
        var total = allContacts.length;
        var alumniCnt = allContacts.filter(function(c){ return c.isAlumni; }).length;
        var ungroupedCnt = allContacts.filter(function(c){ return !c.isAlumni && c.group === '未分组联系人'; }).length;

        function item(label, cnt, key){
            var d = document.createElement('div');
            d.className = 'group-item' + (curGroup === key ? ' active' : '');
            d.innerHTML = '<span>' + esc(label) + '</span><span class="cnt">' + (cnt == null ? '' : cnt) + '</span>';
            d.addEventListener('click', function(){
                curGroup = key; curPage = 1; renderTree(); renderTable();
            });
            tree.appendChild(d);
        }
        item('所有联系人', total, '__all__');
        // 自定义组（来自分组表 + 联系人聚合）
        (groups || []).forEach(function(g){
            if (g.name === '未分组联系人') return;
            item(g.name, g.count, g.name);
        });
        item('未分组联系人', ungroupedCnt, '__ungrouped__');
        var div = document.createElement('div'); div.className = 'group-divider'; tree.appendChild(div);
        item('已认证校友', alumniCnt, '__alumni__');
    }

    // ===== 联系人表格渲染（过滤/搜索/分页） =====
    function getFiltered(){
        var list = allContacts;
        if (curGroup === '__all__') { /* 全部 */ }
        else if (curGroup === '__alumni__') list = list.filter(function(c){ return c.isAlumni; });
        else if (curGroup === '__ungrouped__') list = list.filter(function(c){ return !c.isAlumni && c.group === '未分组联系人'; });
        else list = list.filter(function(c){ return c.group === curGroup; });
        if (curSearch) {
            var q = curSearch.toLowerCase();
            list = list.filter(function(c){ return (c.name || '').toLowerCase().indexOf(q) >= 0 || (c.email || '').toLowerCase().indexOf(q) >= 0 || (c.phone || '').indexOf(q) >= 0; });
        }
        return list;
    }
    function renderTable(){
        var list = getFiltered();
        var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
        if (curPage > totalPages) curPage = totalPages;
        var pageItems = list.slice((curPage - 1) * PAGE_SIZE, curPage * PAGE_SIZE);
        var title = document.querySelector('.contact-title');
        var titleText = '所有联系人';
        if (curGroup === '__alumni__') titleText = '已认证校友';
        else if (curGroup === '__ungrouped__') titleText = '未分组联系人';
        else if (curGroup !== '__all__') titleText = curGroup;
        title.innerHTML = esc(titleText) + '<span class="count">（共' + list.length + '个联系人）</span>';

        var body = document.getElementById('contactBody');
        body.innerHTML = '';
        var empty = document.getElementById('emptyTip');
        if (!pageItems.length) {
            empty.style.display = 'block';
            empty.textContent = '暂无联系人';
        } else {
            empty.style.display = 'none';
        }
        pageItems.forEach(function(c){
            var tr = document.createElement('tr');
            var tdN = document.createElement('td'); tdN.className = 'name'; tdN.textContent = c.name || '（未命名）';
            var tdE = document.createElement('td'); tdE.className = 'email'; tdE.textContent = c.email || '—';
            var tdP = document.createElement('td'); tdP.className = 'phone'; tdP.textContent = c.phone || '—';
            var tdX = document.createElement('td'); tdX.className = 'op';
            if (!c.isAlumni && c.id) {
                var a = document.createElement('a'); a.textContent = '删除';
                a.addEventListener('click', function(){
                    if (!confirm('确定删除联系人「' + (c.name || '') + '」？')) return;
                    fetch(API + '/api/mail/contacts/' + c.id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + getToken() } })
                        .then(function(r){ return r.json(); })
                        .then(function(rj){ showToast(rj.message || '已删除'); loadContacts(); loadGroups(); })
                        .catch(function(){ showToast('网络异常'); });
                });
                tdX.appendChild(a);
            }
            tr.appendChild(tdN); tr.appendChild(tdE); tr.appendChild(tdP); tr.appendChild(tdX);
            body.appendChild(tr);
        });
        document.getElementById('pageTip').textContent = curPage + '/' + totalPages;
        document.getElementById('prevBtn').disabled = curPage <= 1;
        document.getElementById('nextBtn').disabled = curPage >= totalPages;
    }

    // ===== 搜索 / 分页 =====
    var searchTimer = null;
    document.getElementById('searchInput').addEventListener('input', function(){
        clearTimeout(searchTimer);
        var v = this.value;
        searchTimer = setTimeout(function(){ curSearch = v.trim(); curPage = 1; renderTable(); }, 250);
    });
    document.getElementById('prevBtn').addEventListener('click', function(){ if (curPage > 1) { curPage--; renderTable(); } });
    document.getElementById('nextBtn').addEventListener('click', function(){ curPage++; renderTable(); });
    document.getElementById('moreBtn').addEventListener('click', function(){ showToast('更多功能建设中'); });

    // ===== 新建联系组 =====
    document.getElementById('newGroupBtn').addEventListener('click', function(){
        document.getElementById('gName').value = '';
        document.getElementById('modalGroup').style.display = 'flex';
        setTimeout(function(){ document.getElementById('gName').focus(); }, 50);
    });
    document.getElementById('gCancel').addEventListener('click', function(){ document.getElementById('modalGroup').style.display = 'none'; });
    document.getElementById('gOpenContacts').addEventListener('click', function(){
        // 通讯录链接：关闭弹窗并打开新建联系人弹窗
        document.getElementById('modalGroup').style.display = 'none';
        openContactModal();
    });
    document.getElementById('gSave').addEventListener('click', function(){
        var g = document.getElementById('gName').value.trim();
        if (!g) { showToast('请输入联系组名称'); return; }
        fetch(API + '/api/mail/contact-groups', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
            body: JSON.stringify({ name: g })
        })
        .then(function(r){ return r.json(); })
        .then(function(j){
            if (!j.ok) { showToast(j.message || '创建失败'); return; }
            showToast('联系组「' + g + '」已创建');
            document.getElementById('modalGroup').style.display = 'none';
            curGroup = g; curPage = 1;
            loadGroups(); loadContacts();
        })
        .catch(function(){ showToast('网络异常，创建失败'); });
    });

    // ===== 新建联系人 =====
    function openContactModal(){
        document.getElementById('cName').value = '';
        document.getElementById('cEmail').value = '';
        document.getElementById('cPhone').value = '';
        document.getElementById('modalContact').style.display = 'flex';
        setTimeout(function(){ document.getElementById('cName').focus(); }, 50);
    }
    document.getElementById('newContactBtn').addEventListener('click', openContactModal);
    document.getElementById('cCancel').addEventListener('click', function(){ document.getElementById('modalContact').style.display = 'none'; });
    document.getElementById('cSave').addEventListener('click', function(){
        var name = document.getElementById('cName').value.trim();
        if (!name) { showToast('请输入联系人姓名'); return; }
        var payload = {
            name: name,
            email: document.getElementById('cEmail').value.trim(),
            phone: document.getElementById('cPhone').value.trim(),
            group_name: document.getElementById('cGroup').value || '未分组联系人'
        };
        fetch(API + '/api/mail/contacts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
            body: JSON.stringify(payload)
        })
        .then(function(r){ return r.json(); })
        .then(function(j){
            if (!j.ok) { showToast(j.message || '添加失败'); return; }
            showToast('联系人已添加');
            document.getElementById('modalContact').style.display = 'none';
            loadContacts(); loadGroups();
        })
        .catch(function(){ showToast('网络异常，添加失败'); });
    });

    // ===== 通讯录管理视图 =====
    function showManage(){
        document.getElementById('contactsWrap').style.display = 'none';
        var mv = document.getElementById('manageView');
        mv.classList.add('show');
        fetch(API + '/api/mail/contact-groups', { headers: { 'Authorization': 'Bearer ' + getToken() } })
            .then(function(r){ return r.json(); })
            .then(function(j){
                var gs = (j.ok && j.groups) || [];
                var gTotal = gs.length;
                var cTotal = (j.ok && j.total) || allContacts.filter(function(c){ return !c.isAlumni; }).length;
                document.getElementById('manageTitle').innerHTML = '通讯录管理 共' + gTotal + '个联系组，' + cTotal + '个联系人（上限4000人）';
                var body = document.getElementById('manageBody');
                body.innerHTML = '';
                var empty = document.getElementById('manageEmpty');
                if (!gs.length) { empty.style.display = 'block'; }
                else { empty.style.display = 'none'; }
                gs.forEach(function(g){
                    if (g.name === '未分组联系人') return;
                    var tr = document.createElement('tr');
                    var tdN = document.createElement('td'); tdN.className = 'gname'; tdN.textContent = g.name + ' (' + g.count + ')';
                    var tdO = document.createElement('td'); tdO.className = 'op';
                    var rn = document.createElement('a'); rn.textContent = '重命名';
                    rn.addEventListener('click', function(){
                        var nn = prompt('请输入新的联系组名称：', g.name);
                        if (!nn || nn.trim() === g.name) return;
                        fetch(API + '/api/mail/contact-groups/' + encodeURIComponent(g.name), {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
                            body: JSON.stringify({ name: nn.trim() })
                        })
                        .then(function(r){ return r.json(); })
                        .then(function(rj){ showToast(rj.message || '已重命名'); curGroup = '__all__'; curPage = 1; loadGroups(); loadContacts(); showManage(); })
                        .catch(function(){ showToast('网络异常'); });
                    });
                    var cl = document.createElement('a'); cl.textContent = '清空';
                    cl.addEventListener('click', function(){
                        if (!confirm('确定清空联系组「' + g.name + '」内所有联系人？')) return;
                        fetch(API + '/api/mail/contact-groups/' + encodeURIComponent(g.name) + '/clear', { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + getToken() } })
                            .then(function(r){ return r.json(); })
                            .then(function(rj){ showToast(rj.message || '已清空'); curGroup = '__all__'; curPage = 1; loadGroups(); loadContacts(); showManage(); })
                            .catch(function(){ showToast('网络异常'); });
                    });
                    var dl = document.createElement('a'); dl.className = 'danger'; dl.textContent = '删除';
                    dl.addEventListener('click', function(){
                        if (!confirm('确定删除联系组「' + g.name + '」？（组内联系人将移至未分组）')) return;
                        fetch(API + '/api/mail/contact-groups/' + encodeURIComponent(g.name), { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + getToken() } })
                            .then(function(r){ return r.json(); })
                            .then(function(rj){ showToast(rj.message || '已删除'); curGroup = '__all__'; curPage = 1; loadGroups(); loadContacts(); showManage(); })
                            .catch(function(){ showToast('网络异常'); });
                    });
                    tdO.appendChild(rn); tdO.appendChild(cl); tdO.appendChild(dl);
                    tr.appendChild(tdN); tr.appendChild(tdO);
                    body.appendChild(tr);
                });
            })
            .catch(function(){ showToast('网络异常'); });
    }
    document.getElementById('manageBtn').addEventListener('click', showManage);
    document.getElementById('backBtn').addEventListener('click', function(){
        document.getElementById('manageView').classList.remove('show');
        document.getElementById('contactsWrap').style.display = 'flex';
        loadAll();
    });

    loadAll();
})();
</script>
</body>
</html>
