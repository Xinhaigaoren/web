<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人通讯录 - 电子邮件系统</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 1vw; }
    body {
        font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #f4f4f4;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .topbar { width: 100%; height: 5.5rem; background-color: #94070A; display: flex; align-items: center; padding: 0 2rem; gap: 0.5rem; }
    .topbar-left { display: flex; align-items: center; gap: 0.8rem; white-space: nowrap; }
    .topbar-left img { height: 3rem; width: 3rem; border-radius: 50%; object-fit: contain; background-color: rgba(255,255,255,0.08); }
    .topbar-left .logo-text { display: flex; flex-direction: column; color: #fff; }
    .topbar-left .logo-text .zh { font-size: 1rem; line-height: 1.3; }
    .topbar-left .logo-text .en { font-size: 0.7rem; opacity: 0.85; line-height: 1.3; }
    .topbar-left .system-name-big { font-size: 1.8rem; color: #fff; font-weight: normal; letter-spacing: 0.05rem; margin-left: 1rem; }
    .topbar-spacer { flex: 1; }
    .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; }
    .topbar-tools { display: flex; align-items: center; gap: 1.2rem; color: #fff; font-size: 0.9rem; white-space: nowrap; }
    .topbar-tools a { color: #fff; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; opacity: 0.9; transition: opacity 0.3s; }
    .topbar-tools a:hover { opacity: 1; }
    .topbar-menu { display: flex; align-items: center; gap: 1.8rem; font-size: 1.3rem; color: #fff; white-space: nowrap; }
    .topbar-menu a { color: #fff; text-decoration: none; position: relative; padding-bottom: 0.3rem; border-bottom: 1px solid transparent; opacity: 0.92; transition: border-color 0.3s, opacity 0.3s; }
    .topbar-menu a:hover { border-bottom-color: #fff; opacity: 1; }
    .topbar-menu a.active { opacity: 1; }
    .main-layout { flex: 1; display: flex; background-color: #ffffff; }
    .sidebar { width: 12rem; background-color: #f5f5f5; border-right: 1px solid #e0e0e0; padding: 1rem 0; display: flex; flex-direction: column; }
    .sidebar-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1rem; font-size: 0.9rem; color: #333; text-decoration: none; border-left: 3px solid transparent; transition: all 0.3s; }
    .sidebar-btn:hover { background-color: #ebebeb; color: #94070A; }
    .sidebar-btn.active { background-color: #ffffff; border-left-color: #94070A; color: #94070A; font-weight: bold; }
    .sidebar-btn svg { width: 1rem; height: 1rem; fill: currentColor; }

    .content-area { flex: 1; padding: 1.2rem 1.5rem; overflow-y: auto; background: #fff; }

    .contact-header { display: flex; align-items: center; gap: 1rem; padding-bottom: 0.8rem; border-bottom: 1px solid #e8e8e8; margin-bottom: 1rem; flex-wrap: wrap; }
    .contact-header h2 { font-size: 1.2rem; color: #333; font-weight: normal; }
    .btn-add { background: #94070A; color: #fff; border: none; padding: 0.45rem 1.1rem; font-size: 0.9rem; border-radius: 0.25rem; cursor: pointer; font-family: inherit; }
    .btn-add:hover { background: #7a0609; }
    .btn-add-ghost { background: #fff; color: #94070A; border: 1px solid #94070A; padding: 0.45rem 1.1rem; font-size: 0.9rem; border-radius: 0.25rem; cursor: pointer; font-family: inherit; }
    .btn-add-ghost:hover { background: #fdf1f1; }
    .contact-header .count { color: #999; font-size: 0.85rem; }

    .contact-table { width: 100%; border-collapse: collapse; }
    .contact-table th { text-align: left; padding: 0.6rem 0.8rem; font-size: 0.85rem; color: #666; font-weight: normal; border-bottom: 1px solid #e0e0e0; }
    .contact-table td { padding: 0.7rem 0.8rem; font-size: 0.9rem; border-bottom: 1px solid #f0f0f0; color: #333; }
    .contact-table tr:hover { background-color: #fafafa; }
    .contact-table .name { font-weight: bold; }
    .contact-table .email { color: #0a8043; }
    .contact-table .tag { display: inline-block; background: #f0f0f0; color: #666; font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 0.5rem; margin-left: 0.4rem; }
    .contact-table .tag-alumni { background: #fdeaea; color: #94070A; }
    .del-link { color: #999; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }
    .del-link:hover { color: #94070A; }
    .empty-tip { text-align: center; color: #999; padding: 3rem 0; font-size: 0.95rem; }

    /* 弹窗 */
    .modal-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 98; display: none; align-items: center; justify-content: center; }
    .modal { background: #fff; border-radius: 0.4rem; width: 420px; max-width: 92vw; padding: 1.4rem 1.6rem; box-shadow: 0 6px 24px rgba(0,0,0,0.18); }
    .modal h3 { font-size: 1.1rem; color: #333; font-weight: normal; margin-bottom: 1rem; }
    .modal .field { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.8rem; }
    .modal .field label { width: 5rem; color: #666; font-size: 0.9rem; flex-shrink: 0; }
    .modal .field input, .modal .field select { flex: 1; border: 1px solid #d0d0d0; border-radius: 0.25rem; padding: 0.45rem 0.6rem; font-size: 0.9rem; font-family: inherit; }
    .modal .field input:focus, .modal .field select:focus { border-color: #94070A; outline: none; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1rem; }
    .modal-actions button { padding: 0.45rem 1.2rem; font-size: 0.9rem; border-radius: 0.25rem; cursor: pointer; font-family: inherit; }
    .modal-actions .btn-ok { background: #94070A; color: #fff; border: none; }
    .modal-actions .btn-ok:hover { background: #7a0609; }
    .modal-actions .btn-cancel { background: #fff; border: 1px solid #d0d0d0; color: #333; }
    .modal-actions .btn-cancel:hover { border-color: #94070A; color: #94070A; }
    .toast { position: fixed; top: 6rem; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 0.6rem 1.4rem; border-radius: 0.3rem; font-size: 0.9rem; z-index: 99; display: none; }
</style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left">
        <img src="assets/haigao-logo.jpg" alt="Logo">
        <div class="logo-text">
            <span class="zh">海林市高级中学校友（新海高人）</span>
            <span class="en">Hailin Senior High School Alumni Association</span>
        </div>
        <span class="system-name-big">电子邮件系统</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-right">
        <div class="topbar-tools">
            <a href="member.html">内网系统</a>
            <a href="index.html">校友官网</a>
        </div>
        <nav class="topbar-menu">
            <a href="mail-inbox.html">收件箱</a>
            <a href="mail-sent.html">已发送</a>
            <a href="mail-compose.html">写信</a>
            <a href="mail-contact.html" class="active">其他文件夹</a>
        </nav>
    </div>
</header>

<div class="main-layout">
    <aside class="sidebar">
        <a href="mail-compose.html" class="sidebar-btn">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg>
            写信
        </a>
        <a href="mail-inbox.html" class="sidebar-btn inbox">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/></svg>
            收件箱
        </a>
        <a href="mail-sent.html" class="sidebar-btn sent">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            已发送
        </a>
        <a href="mail-contact.html" class="sidebar-btn active">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            联系人
        </a>
        <a href="mail-contact.html" class="sidebar-btn">其他文件夹</a>
    </aside>

    <section class="content-area">
        <div class="contact-header">
            <h2>所有联系人</h2>
            <span class="count" id="countTip"></span>
            <span style="flex:1"></span>
            <button class="btn-add-ghost" id="newGroupBtn">新建联系组</button>
            <button class="btn-add" id="newContactBtn">新建联系人</button>
        </div>

        <table class="contact-table">
            <thead>
                <tr>
                    <th style="width:10rem;">姓名</th>
                    <th>邮箱</th>
                    <th>电话</th>
                    <th>所在地 / 分组</th>
                    <th style="width:5rem;"></th>
                </tr>
            </thead>
            <tbody id="contactBody"></tbody>
        </table>
        <div class="empty-tip" id="emptyTip" style="display:none;">暂无联系人</div>
    </section>
</div>

<!-- 新建联系人弹窗 -->
<div class="modal-mask" id="modalContact">
    <div class="modal">
        <h3>新建联系人</h3>
        <div class="field"><label>姓名：</label><input type="text" id="cName" placeholder="必填"></div>
        <div class="field"><label>邮箱：</label><input type="text" id="cEmail" placeholder="校友邮箱，如 xx24@xinhaigaoren.org.cn"></div>
        <div class="field"><label>手机：</label><input type="text" id="cPhone"></div>
        <div class="field"><label>联系组：</label><select id="cGroup"><option value="">未分组联系人</option></select></div>
        <div class="field"><label>备注：</label><input type="text" id="cNote"></div>
        <div class="modal-actions">
            <button class="btn-cancel" id="cCancel">取消</button>
            <button class="btn-ok" id="cSave">保存</button>
        </div>
    </div>
</div>

<!-- 新建联系组弹窗 -->
<div class="modal-mask" id="modalGroup">
    <div class="modal">
        <h3>新建联系组</h3>
        <div class="field"><label>组名：</label><input type="text" id="gName" placeholder="如：同班同学"></div>
        <div class="modal-actions">
            <button class="btn-cancel" id="gCancel">取消</button>
            <button class="btn-ok" id="gSave">保存</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
    var API = 'https://hailin-alumni-api.onrender.com';
    var GROUPS_KEY = 'mail_my_groups';
    function getToken(){ return localStorage.getItem('alumniToken') || ''; }
    if (!getToken()) { location.href = 'login.html?redirect=mail-contact.html'; return; }

    var toast = document.getElementById('toast');
    function showToast(t){ toast.textContent = t; toast.style.display = 'block'; clearTimeout(showToast._t); showToast._t = setTimeout(function(){ toast.style.display = 'none'; }, 2400); }
    function getMyGroups(){ try { return JSON.parse(localStorage.getItem(GROUPS_KEY) || '[]'); } catch(e) { return []; } }
    function saveMyGroups(g){ localStorage.setItem(GROUPS_KEY, JSON.stringify(g)); }

    function load(){
        fetch(API + '/api/mail/contacts', { headers: { 'Authorization': 'Bearer ' + getToken() } })
            .then(function(r){ return r.json(); })
            .then(function(j){
                if (!j.ok) { showToast(j.message || '加载失败'); return; }
                var body = document.getElementById('contactBody');
                body.innerHTML = '';
                var alumni = (j.alumni || []).map(function(a){ return { name: a.name, email: a.email, phone: '', meta: (a.city || '') + (a.graduation_year ? ' · ' + a.graduation_year + '届' : ''), group: '已认证校友', isAlumni: true }; });
                var personal = (j.personal || []).map(function(c){ return { id: c.id, name: c.name, email: c.email, phone: c.phone, meta: c.group_name || '未分组联系人', group: c.group_name || '未分组联系人', isAlumni: false }; });
                var all = alumni.concat(personal);
                document.getElementById('emptyTip').style.display = all.length ? 'none' : 'block';
                document.getElementById('countTip').textContent = '共 ' + all.length + ' 人（含 ' + alumni.length + ' 位已认证校友）';
                all.forEach(function(c){
                    var tr = document.createElement('tr');
                    var tdN = document.createElement('td'); tdN.className = 'name'; tdN.textContent = c.name;
                    var tag = document.createElement('span'); tag.className = c.isAlumni ? 'tag tag-alumni' : 'tag'; tag.textContent = c.group;
                    tdN.appendChild(tag);
                    var tdE = document.createElement('td'); tdE.className = 'email'; tdE.textContent = c.email || '—';
                    var tdP = document.createElement('td'); tdP.textContent = c.phone || '—';
                    var tdM = document.createElement('td'); tdM.textContent = c.meta || '—';
                    var tdX = document.createElement('td');
                    if (!c.isAlumni && c.id) {
                        var a = document.createElement('a'); a.className = 'del-link'; a.textContent = '删除';
                        a.addEventListener('click', function(){
                            if (!confirm('确定删除联系人「' + c.name + '」？')) return;
                            fetch(API + '/api/mail/contacts/' + c.id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + getToken() } })
                                .then(function(r){ return r.json(); })
                                .then(function(rj){ showToast(rj.message || '已删除'); load(); });
                        });
                        tdX.appendChild(a);
                    }
                    tr.appendChild(tdN); tr.appendChild(tdE); tr.appendChild(tdP); tr.appendChild(tdM); tr.appendChild(tdX);
                    body.appendChild(tr);
                });
                // 更新新建联系人分组下拉
                var sel = document.getElementById('cGroup');
                var groups = getMyGroups();
                var cur = sel.value;
                sel.innerHTML = '<option value="">未分组联系人</option>';
                groups.forEach(function(g){ var o = document.createElement('option'); o.value = g; o.textContent = g; sel.appendChild(o); });
                if (cur) sel.value = cur;
            })
            .catch(function(){ showToast('网络异常，请稍后重试'); });
    }

    // 新建联系人
    document.getElementById('newContactBtn').addEventListener('click', function(){
        document.getElementById('cName').value = '';
        document.getElementById('cEmail').value = '';
        document.getElementById('cPhone').value = '';
        document.getElementById('cNote').value = '';
        document.getElementById('modalContact').style.display = 'flex';
    });
    document.getElementById('cCancel').addEventListener('click', function(){ document.getElementById('modalContact').style.display = 'none'; });
    document.getElementById('cSave').addEventListener('click', function(){
        var name = document.getElementById('cName').value.trim();
        if (!name) { showToast('请输入联系人姓名'); return; }
        var payload = {
            name: name,
            email: document.getElementById('cEmail').value.trim(),
            phone: document.getElementById('cPhone').value.trim(),
            group_name: document.getElementById('cGroup').value || '未分组联系人',
            note: document.getElementById('cNote').value.trim()
        };
        fetch(API + '/api/mail/contacts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
            body: JSON.stringify(payload)
        })
        .then(function(r){ return r.json(); })
        .then(function(j){
            if (!j.ok) { showToast(j.message || '添加失败'); return; }
            showToast('联系人已添加');
            document.getElementById('modalContact').style.display = 'none';
            load();
        })
        .catch(function(){ showToast('网络异常，添加失败'); });
    });

    // 新建联系组
    document.getElementById('newGroupBtn').addEventListener('click', function(){
        document.getElementById('gName').value = '';
        document.getElementById('modalGroup').style.display = 'flex';
    });
    document.getElementById('gCancel').addEventListener('click', function(){ document.getElementById('modalGroup').style.display = 'none'; });
    document.getElementById('gSave').addEventListener('click', function(){
        var g = document.getElementById('gName').value.trim();
        if (!g) { showToast('请输入联系组名称'); return; }
        var groups = getMyGroups();
        if (groups.indexOf(g) >= 0) { showToast('该联系组已存在'); return; }
        groups.push(g);
        saveMyGroups(groups);
        showToast('联系组「' + g + '」已创建');
        document.getElementById('modalGroup').style.display = 'none';
        load();
    });

    load();
})();
</script>
</body>
</html>
