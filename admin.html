<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校友审批 - 海林市高级中学校友（新海高人）</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: clamp(12px, 1vw, 18px); }
    body {
        font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #f4f4f4;
        min-height: 100vh;
    }

    /* ========== 顶部导航栏 ========== */
    .topbar {
        width: 100%; height: 6.5rem; background-color: #94070A;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 3rem;
    }
    .topbar-left { display: flex; align-items: center; gap: 1rem; white-space: nowrap; }
    .topbar-left img {
        height: 3.5rem; width: 3.5rem; border-radius: 50%;
        object-fit: contain; background-color: rgba(255,255,255,0.08);
    }
    .topbar-left .logo-text { display: flex; flex-direction: column; color: #fff; }
    .topbar-left .logo-text .zh { font-size: 1.15rem; line-height: 1.3; }
    .topbar-left .logo-text .en { font-size: 0.75rem; opacity: 0.85; line-height: 1.3; }
    .topbar-left .system-name-big {
        font-size: 2rem; color: #fff; font-weight: normal;
        letter-spacing: 0.05rem; margin-left: 1.5rem;
    }
    .topbar-right {
        display: flex; align-items: center; gap: 1.5rem;
        color: #fff; font-size: 1rem; white-space: nowrap;
    }
    .topbar-right a {
        color: #fff; text-decoration: none;
        display: flex; align-items: center; gap: 0.3rem;
    }
    .topbar-right svg { width: 0.8rem; height: 0.8rem; fill: #fff; }

    /* ========== 页面标题 ========== */
    .page-title {
        max-width: 90rem; margin: 0 auto;
        padding: 2rem 3rem 1rem;
        font-size: 1.6rem; color: #333; font-weight: normal;
    }

    /* ========== 主卡片 ========== */
    .main-content { max-width: 90rem; margin: 0 auto; padding: 0 3rem 3rem; overflow-x: auto; }
    .info-card {
        background-color: #fff; border-radius: 0.3rem;
        border: 1px solid #e0e0e0; padding: 2.5rem 3rem;
    }

    /* ========== 审批表单 ========== */
    .form-section-title {
        font-size: 1.1rem; color: #333;
        margin: 0 0 1.5rem; padding-bottom: 0.8rem;
        border-bottom: 1px solid #e8e8e8;
    }
    .form-table {
        width: 100%; border-collapse: collapse;
        border: 1px solid #e0e0e0; margin-bottom: 2rem;
    }
    .form-table tr { border-bottom: 1px solid #e8e8e8; }
    .form-table tr:last-child { border-bottom: none; }
    .form-table td {
        padding: 1rem 1.5rem; font-size: 0.95rem;
        color: #333; vertical-align: middle;
    }
    .form-table td.label {
        width: 18%; background-color: #fafafa; color: #666;
        border-right: 1px solid #e8e8e8;
    }
    .form-table td.value {
        width: 32%; color: #333;
        border-right: 1px solid #e8e8e8;
    }
    .form-table td.value:last-child { border-right: none; }

    /* ========== 审批按钮 ========== */
    .btn-row { display: flex; gap: 1rem; margin-bottom: 2.5rem; }
    .btn {
        display: inline-flex; align-items: center; gap: 0.4rem;
        padding: 0.7rem 2rem; font-size: 0.95rem; border-radius: 0.3rem;
        cursor: pointer; font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        transition: all 0.3s; border: 1px solid transparent;
    }
    .btn svg { width: 1rem; height: 1rem; }
    .btn-pass { background-color: #94070A; color: #fff; }
    .btn-pass svg { fill: #fff; }
    .btn-pass:hover { background-color: #b81c20; }
    .btn-reject { background-color: #fff; color: #333; border: 1px solid #d0d0d0; }
    .btn-reject svg { fill: #333; }
    .btn-reject:hover { border-color: #94070A; color: #94070A; }
    .btn-reject:hover svg { fill: #94070A; }

    /* ========== 数据表格 ========== */
    .data-table {
        width: 100%; border-collapse: collapse; border: 1px solid #e0e0e0;
    }
    .data-table th {
        background-color: #fafafa; color: #333; font-size: 0.95rem;
        font-weight: normal; padding: 1.2rem 1rem;
        text-align: left; border-bottom: 1px solid #e0e0e0;
    }
    .data-table td {
        padding: 1.2rem 1rem; font-size: 0.95rem;
        color: #333; border-bottom: 1px solid #f0f0f0;
    }
    .data-table tr { cursor: pointer; transition: background 0.2s; }
    .data-table tr:hover { background-color: #fafafa; }
    .data-table tr.selected { background-color: #fff5f5; }

    .approve-btn {
        padding: 0.4rem 0.9rem; font-size: 0.85rem; border-radius: 0.2rem;
        cursor: pointer; font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        margin-right: 0.4rem; transition: all 0.3s; border: 1px solid transparent;
    }
    .approve-btn.pass { background-color: #94070A; color: #fff; }
    .approve-btn.pass:hover { background-color: #b81c20; }
    .approve-btn.reject { background-color: #fff; color: #333; border: 1px solid #d0d0d0; }
    .approve-btn.reject:hover { border-color: #94070A; color: #94070A; }

    /* ========== 分页组件 ========== */
    .pagination {
        display: flex; align-items: center; justify-content: space-between;
        padding: 1.5rem 0 0; font-size: 0.9rem; color: #333;
    }
    .pagination-left { display: flex; align-items: center; gap: 0.6rem; }
    .pagination-left select {
        padding: 0.4rem 0.6rem; font-size: 0.9rem;
        border: 1px solid #d0d0d0; border-radius: 0.2rem;
        background-color: #fff; outline: none; cursor: pointer;
        font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    }
    .pagination-left select:focus { border-color: #94070A; }

    .pagination-right { display: flex; align-items: center; gap: 0.5rem; }
    .pagination-right .jump-input {
        width: 3.5rem; padding: 0.4rem 0.5rem; text-align: center;
        font-size: 0.9rem; border: 1px solid #d0d0d0;
        border-radius: 0.2rem; outline: none;
        font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    }
    .pagination-right .jump-input:focus { border-color: #94070A; }

    .page-btn {
        padding: 0.4rem 0.9rem; font-size: 0.9rem;
        border: 1px solid #d0d0d0; border-radius: 0.2rem;
        background-color: #fff; color: #333; cursor: pointer;
        font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        transition: all 0.3s;
    }
    .page-btn:hover:not(.disabled):not(.active) {
        border-color: #94070A; color: #94070A;
    }
    .page-btn.active {
        background-color: #94070A; color: #fff;
        border-color: #94070A; cursor: default;
    }
    .page-btn.disabled { opacity: 0.5; cursor: not-allowed; }
</style>
  <link rel="icon" href="assets/favicon.png" />
</head>
<body>

<!-- ========== 顶部导航栏 ========== -->
<header class="topbar">
    <div class="topbar-left">
        <img src="assets/haigao-logo.jpg" alt="Logo">
        <div class="logo-text">
            <span class="zh">海林市高级中学校友（新海高人）</span>
            <span class="en">Hailin Senior High School Alumni Association</span>
        </div>
        <span class="system-name-big">用户电子身份服务系统</span>
    </div>
    <div class="topbar-right">
        <a href="#">
            中文
            <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </a>
        <a href="login.html">登录</a>
    </div>
</header>

<!-- ========== 页面标题 ========== -->
<div class="page-title">校友审批</div>

<!-- ========== 主卡片 ========== -->
<div class="main-content">
    <div class="info-card">

        <!-- 审批表单（动态填充） -->
        <h3 class="form-section-title">审批表单</h3>
        <table class="form-table">
            <tr>
                <td class="label">真实姓名</td>
                <td class="value" id="f-name">-</td>
                <td class="label">所在地区</td>
                <td class="value" id="f-region">-</td>
            </tr>
            <tr>
                <td class="label">手机</td>
                <td class="value" id="f-phone">-</td>
                <td class="label">邮箱</td>
                <td class="value" id="f-email">-</td>
            </tr>
            <tr>
                <td class="label">用户名</td>
                <td class="value" id="f-username">-</td>
                <td class="label">密码</td>
                <td class="value" id="f-password">-</td>
            </tr>
            <tr>
                <td class="label">入学年</td>
                <td class="value" id="f-enrollYear">-</td>
                <td class="label">离校年</td>
                <td class="value" id="f-graduateYear">-</td>
            </tr>
            <tr>
                <td class="label">毕业班级</td>
                <td class="value" id="f-major">-</td>
                <td class="label">班主任老师</td>
                <td class="value" id="f-teacher">-</td>
            </tr>
            <tr>
                <td class="label">注册说明</td>
                <td class="value" colspan="3" id="f-remark">-</td>
            </tr>
        </table>

        <!-- 通过 / 拒绝按钮 -->
        <div class="btn-row">
            <button class="btn btn-pass" id="approveBtn">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                通过审批
            </button>
            <button class="btn btn-reject" id="rejectBtn">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                拒绝
            </button>
        </div>

        <!-- 数据表格 -->
        <table class="data-table">
            <thead>
                <tr>
                    <th>序号</th>
                    <th>姓名</th>
                    <th>毕业届别</th>
                    <th>所在班级</th>
                    <th>联系电话</th>
                    <th>申请时间</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 数据由 JS 动态渲染 -->
            </tbody>
        </table>

        <!-- 分页组件 -->
        <div class="pagination">
            <div class="pagination-left">
                每页显示
                <select id="pageSizeSelect">
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="50">50</option>
                </select>
                条　当前第 <span id="pageRange">1 - 20</span> 条 共计 <span id="totalCount">43</span> 条
            </div>

            <div class="pagination-right">
                到第
                <input type="text" class="jump-input" id="jumpInput" value="1">
                页
                <button class="page-btn" id="jumpBtn">跳转</button>
                <button class="page-btn disabled" id="prevBtn">上一页</button>
                <button class="page-btn active" data-page="1">1</button>
                <button class="page-btn" data-page="2">2</button>
                <button class="page-btn" data-page="3">3</button>
                <button class="page-btn" id="nextBtn">下一页</button>
            </div>
        </div>

    </div>
</div>

<script>
/* ============================================================
   校友审批后台：数据来自后端 API（需管理员登录 token）
   ============================================================ */
const API_BASE_URL = 'https://hailin-alumni-api.onrender.com';
const adminToken = localStorage.getItem('adminToken');
if (!adminToken) { location.href = 'admin-login.html'; }

const tableBody = document.getElementById('tableBody');
let applications = [];
let selectedIndex = 0;
let pageSize = 20;

/* 从后端加载待审批列表 */
async function loadApplications() {
    try {
        const resp = await fetch(API_BASE_URL + '/api/applications?status=pending', {
            headers: { 'Authorization': 'Bearer ' + adminToken }
        });
        const data = await resp.json();
        if (!resp.ok) { alert(data.message || '加载审批列表失败，请重新登录'); return; }
        applications = data.applications || [];
        renderTable();
    } catch (err) {
        alert('网络异常，无法加载审批列表（' + err.message + '）');
    }
}

/* 渲染表格 */
function renderTable() {
    tableBody.innerHTML = '';
    const pageData = applications.slice(0, pageSize);
    pageData.forEach((item, i) => {
        const tr = document.createElement('tr');
        tr.dataset.index = i;
        const statusText = item.status === 'approved' ? '已通过' : (item.status === 'rejected' ? '已拒绝' : '待审批');
        tr.innerHTML = `
            <td>${i + 1}</td>
            <td>${item.name || '-'}</td>
            <td>${item.graduation_year ? item.graduation_year + ' 届' : '-'}</td>
            <td>${item.class_name || '-'}</td>
            <td>${item.phone || '-'}</td>
            <td>${(item.created_at || '').slice(0, 10) || '-'}</td>
            <td>${statusText}</td>
            <td>
                <button class="approve-btn pass">通过</button>
                <button class="approve-btn reject">拒绝</button>
            </td>
        `;
        tr.addEventListener('click', (e) => {
            if (e.target.classList.contains('approve-btn')) return;
            selectRow(i);
        });
        tableBody.appendChild(tr);
    });
    const totalCount = document.getElementById('totalCount');
    totalCount.textContent = applications.length;
    const pageRange = document.getElementById('pageRange');
    pageRange.textContent = applications.length ? `1 - ${Math.min(pageSize, applications.length)}` : '0 - 0';
    if (applications.length) selectRow(0); else clearForm();
}

function clearForm() {
    ['f-name', 'f-region', 'f-phone', 'f-email', 'f-username', 'f-password', 'f-enrollYear', 'f-graduateYear', 'f-major', 'f-teacher', 'f-remark'].forEach(id => {
        document.getElementById(id).textContent = '-';
    });
}

/* 选中某行 → 填充审批表单 */
function selectRow(index) {
    selectedIndex = index;
    const data = applications[index];
    document.querySelectorAll('.data-table tbody tr').forEach(tr => {
        tr.classList.toggle('selected', Number(tr.dataset.index) === index);
    });
    document.getElementById('f-name').textContent = data.name || '-';
    document.getElementById('f-region').textContent = [data.current_province, data.current_city].filter(Boolean).join(' ') || (data.province || '-');
    document.getElementById('f-phone').textContent = data.phone || '-';
    document.getElementById('f-email').textContent = data.account_email || '-';
    document.getElementById('f-username').textContent = data.account_email || '-';
    document.getElementById('f-password').textContent = '已加密存储';
    document.getElementById('f-enrollYear').textContent = data.enrollment_year || '-';
    document.getElementById('f-graduateYear').textContent = data.graduation_year || '-';
    document.getElementById('f-major').textContent = data.class_name || '-';
    document.getElementById('f-teacher').textContent = data.homeroom_teacher || '-';
    document.getElementById('f-remark').textContent = (data.extra_materials && data.extra_materials !== '[]') ? data.extra_materials : '—';
}

/* 通过 / 拒绝（提交到后端） */
async function reviewApplication(status, rejectReason) {
    const data = applications[selectedIndex];
    if (!data) return;
    if (!confirm((status === 'approved' ? '确认通过 ' : '确认拒绝 ') + (data.name || '') + ' 的认证申请？')) return;
    try {
        const resp = await fetch(API_BASE_URL + '/api/applications/' + data.id + '/status', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminToken },
            body: JSON.stringify({ status, reject_reason: rejectReason || null })
        });
        const result = await resp.json();
        if (!resp.ok) { alert(result.message || '操作失败'); return; }
        alert((status === 'approved' ? '已通过 ' : '已拒绝 ') + (data.name || '') + ' 的认证申请');
        await loadApplications();
    } catch (err) {
        alert('网络异常，操作失败（' + err.message + '）');
    }
}

document.getElementById('approveBtn').addEventListener('click', () => reviewApplication('approved'));
document.getElementById('rejectBtn').addEventListener('click', () => {
    const reason = prompt('请输入拒绝原因（可留空）：');
    if (reason === null) return;
    reviewApplication('rejected', reason);
});

/* 每页条数 */
const pageSizeSelect = document.getElementById('pageSizeSelect');
pageSizeSelect.addEventListener('change', () => {
    pageSize = Number(pageSizeSelect.value);
    renderTable();
});

/* 初始化 */
loadApplications();
</script>

</body>
</html>
