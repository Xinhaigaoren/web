<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校友注册（第二步） - 海林市高级中学校友（新海高人）</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: clamp(11px, 1.05vw, 14px); }
    body { font-family: "Microsoft YaHei", "微软雅黑", sans-serif; background: linear-gradient(135deg, #94070A 0%, #c41e22 40%, #e85d5d 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 3rem 2rem; }
    .register-header { display: flex; align-items: center; justify-content: center; gap: 1rem; margin: auto 0 1.5rem 0; }
    .register-header .logo-circle { height: 4rem; width: 4rem; object-fit: contain; border-radius: 50%; filter: drop-shadow(0 0.3rem 0.6rem rgba(0,0,0,0.3)); }
    .register-header .logo-text-area { display: flex; flex-direction: column; justify-content: center; color: #ffffff; white-space: nowrap; }
    .register-header .logo-text-area .zh { font-size: 1.3rem; font-weight: normal; line-height: 1.4; letter-spacing: 0.05rem; text-shadow: 0 0.2rem 0.5rem rgba(0,0,0,0.3); }
    .register-header .logo-text-area .en { font-size: 0.85rem; font-weight: normal; line-height: 1.4; margin-top: 0.1rem; opacity: 0.9; letter-spacing: 0.02rem; text-shadow: 0 0.2rem 0.5rem rgba(0,0,0,0.3); }
    .register-card { width: 100%; max-width: 46rem; background: linear-gradient(135deg, #fff5f5 0%, #ffe8e8 100%); border-radius: 0.5rem; box-shadow: 0 1rem 3rem rgba(0,0,0,0.25); padding: 2rem 3rem 2.5rem; margin-bottom: auto; }
    .form-row { display: flex; align-items: flex-start; margin-bottom: 0.6rem; }
    .form-label { flex: 0 0 8rem; text-align: right; font-size: 0.95rem; color: #333; padding-top: 0.7rem; padding-right: 1rem; }
    .form-label .required { color: #d8000c; margin-right: 0.2rem; }
    .form-input-area { flex: 1; display: flex; flex-direction: column; }
    .form-input-area input[type="text"], .form-input-area input[type="password"], .form-input-area select, .form-input-area textarea { width: 100%; max-width: 32rem; padding: 0.7rem 0.9rem; font-size: 0.95rem; border: 1px solid #e0c8c0; border-radius: 0.3rem; outline: none; background: #ffffff; font-family: "Microsoft YaHei", "微软雅黑", sans-serif; transition: border-color 0.3s; }
    .form-input-area input:focus, .form-input-area select:focus, .form-input-area textarea:focus { border-color: #94070A; box-shadow: 0 0 0 0.15rem rgba(148,7,10,0.12); }
    .form-input-area select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 0.8rem center; background-size: 1rem; padding-right: 2.5rem; cursor: pointer; }
    .form-input-area textarea { min-height: 10rem; resize: vertical; line-height: 1.6; }
    .inline-row { display: flex; align-items: center; gap: 1rem; max-width: 32rem; }
    .inline-item { display: flex; align-items: center; gap: 0.8rem; }
    .inline-item select { width: 12rem; }
    .inline-item .static-label { font-size: 0.95rem; color: #333; white-space: nowrap; }
    .divider-line { width: 100%; max-width: 32rem; height: 1px; background: #e0c8c0; margin: 1.5rem auto; }
    .btn-row { display: flex; justify-content: center; gap: 1.5rem; }
    .prev-btn { width: 10rem; padding: 0.8rem; font-size: 1.05rem; font-weight: normal; color: #333; background: #ffffff; border: 1px solid #d0d0d0; border-radius: 0.3rem; cursor: pointer; font-family: "Microsoft YaHei", "微软雅黑", sans-serif; transition: all 0.3s; }
    .prev-btn:hover { background: #f5f5f5; border-color: #999; }
    .submit-btn { width: 10rem; padding: 0.8rem; font-size: 1.05rem; font-weight: normal; color: #ffffff; background: #2d6cb5; border: none; border-radius: 0.3rem; cursor: pointer; font-family: "Microsoft YaHei", "微软雅黑", sans-serif; transition: background 0.3s; }
    .submit-btn:hover { background: #1e559a; }
</style>
</head>
<body>

<div class="register-header">
    <img src="assets/haigao-logo.jpg" alt="Logo" class="logo-circle">
    <div class="logo-text-area">
        <span class="zh">海林市高级中学校友（新海高人）</span>
        <span class="en">Hailin Senior High School Alumni Association</span>
    </div>
</div>

<div class="register-card">

    <div class="form-row">
        <div class="form-label"><span class="required">*</span>用户名</div>
        <div class="form-input-area"><input type="text" id="username" placeholder="请输入用户名" autocomplete="off"></div>
    </div>

    <div class="form-row">
        <div class="form-label"><span class="required">*</span>密码</div>
        <div class="form-input-area"><input type="password" id="password" placeholder="请输入密码" autocomplete="new-password"></div>
    </div>

    <div class="form-row">
        <div class="form-label"><span class="required">*</span>确认密码</div>
        <div class="form-input-area"><input type="password" id="confirmPassword" placeholder="请再次输入密码" autocomplete="new-password"></div>
    </div>

    <div class="form-row">
        <div class="form-label"><span class="required">*</span>入学年</div>
        <div class="form-input-area">
            <div class="inline-row">
                <div class="inline-item">
                    <select id="enrollYear"><option value="">--请选择--</option></select>
                </div>
                <div class="inline-item">
                    <span class="static-label">离校年</span>
                    <select id="graduateYear"><option value="">--请选择--</option></select>
                </div>
            </div>
        </div>
    </div>

    <div class="form-row">
        <div class="form-label"><span class="required">*</span>专业</div>
        <div class="form-input-area"><input type="text" id="major" placeholder="请输入专业"></div>
    </div>

    <div class="form-row">
        <div class="form-label"><span class="required">*</span>班主任老师</div>
        <div class="form-input-area"><input type="text" id="headTeacher" placeholder="请输入班主任老师姓名"></div>
    </div>

    <div class="form-row">
        <div class="form-label">注册说明</div>
        <div class="form-input-area"><textarea id="registerNote" placeholder="如有需要说明的情况，请在此填写"></textarea></div>
    </div>

    <div class="divider-line"></div>

    <div class="btn-row">
        <button type="button" class="prev-btn" onclick="history.back()">上一步</button>
        <button type="button" class="submit-btn">提交</button>
    </div>

</div>

<script>
    const enrollYear = document.getElementById('enrollYear');
    const graduateYear = document.getElementById('graduateYear');
    function fillYears(selectElement) {
        for (let year = 1984; year <= 2027; year++) {
            const option = document.createElement('option');
            option.value = year;
            option.textContent = (year === 2027) ? '2027（待）' : year;
            selectElement.appendChild(option);
        }
    }
    fillYears(enrollYear);
    fillYears(graduateYear);
</script>

</body>
</html>
