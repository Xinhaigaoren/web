<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮件详情 - 校友电子邮件系统 - 新海高人</title>
<link rel="icon" href="assets/favicon.png">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: clamp(12px, 1vw, 18px); }
    body {
        font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #f4f4f4;
        min-height: 100vh;
    }

    /* ===== 顶部导航 ===== */
    .topbar {
        width: 100%; height: 5.5rem;
        background-color: #94070A;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 3rem;
    }
    .topbar-left { display: flex; align-items: center; gap: 1rem; white-space: nowrap; }
    .topbar-left img { height: 3.2rem; width: 3.2rem; border-radius: 50%; object-fit: contain; background-color: rgba(255,255,255,0.08); }
    .topbar-left .logo-text { display: flex; flex-direction: column; color: #fff; }
    .topbar-left .logo-text .zh { font-size: 1.1rem; line-height: 1.3; }
    .topbar-left .logo-text .en { font-size: 0.75rem; opacity: 0.85; line-height: 1.3; }
    .topbar-left .system-name-big { font-size: 2rem; color: #fff; font-weight: normal; letter-spacing: 0.05rem; margin-left: 1.5rem; }
    .topbar-user { display: flex; align-items: center; gap: 0.6rem; color: #fff; font-size: 0.9rem; }
    .topbar-user .user-avatar {
        width: 2.2rem; height: 2.2rem; border-radius: 50%;
        background-color: #fff; display: flex; align-items: center; justify-content: center;
        color: #94070A; font-weight: bold; font-size: 0.95rem;
    }

    /* ===== 主体布局 ===== */
    .layout { display: flex; max-width: 95rem; margin: 0 auto; padding: 1.5rem 2rem; gap: 1.5rem; align-items: flex-start; }
    .sidebar {
        width: 12.5rem; flex-shrink: 0;
        background-color: #fff; border-radius: 0.5rem;
        border: 1px solid #e8e8e8; padding: 1.2rem 0.8rem;
        position: sticky; top: 1.5rem;
    }
    .sidebar .compose-btn {
        display: block; width: 100%; text-align: center;
        background: linear-gradient(135deg, #94070A 0%, #c41e22 100%);
        color: #fff; text-decoration: none; border-radius: 0.35rem;
        padding: 0.75rem 0; font-size: 1rem; letter-spacing: 0.1rem;
        margin-bottom: 1.2rem;
    }
    .sidebar .compose-btn:hover { opacity: 0.9; }
    .sidebar .nav-item {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.65rem 0.9rem; border-radius: 0.35rem;
        color: #333; text-decoration: none; font-size: 0.95rem;
        margin-bottom: 0.25rem; cursor: pointer;
    }
    .sidebar .nav-item:hover { background-color: #fbe5e5; color: #94070A; }
    .sidebar .nav-item.active { background-color: #94070A; color: #fff; }
    .sidebar .nav-item .badge {
        background-color: #e00; color: #fff; font-size: 0.7rem;
        border-radius: 0.8rem; padding: 0.05rem 0.45rem; min-width: 1.2rem; text-align: center;
    }
    .sidebar .side-title { font-size: 0.8rem; color: #999; padding: 0.6rem 0.9rem 0.3rem; }
    .sidebar .back-link {
        display: block; margin-top: 1rem; padding: 0.6rem 0.9rem;
        font-size: 0.85rem; color: #666; text-decoration: none;
        border-top: 1px solid #eee;
    }
    .sidebar .back-link:hover { color: #94070A; }

    .main { flex: 1; min-width: 0; background-color: #fff; border-radius: 0.5rem; border: 1px solid #e8e8e8; }

    /* ===== 邮件正文 ===== */
    .detail-top { display: flex; align-items: center; gap: 0.8rem; padding: 1rem 1.5rem; border-bottom: 1px solid #e8e8e8; flex-wrap: wrap; }
    .detail-top .back { color: #94070A; text-decoration: none; font-size: 0.95rem; }
    .detail-top .back:hover { text-decoration: underline; }
    .detail-top .spacer { flex: 1; }
    .detail-top .tool {
        background: none; border: 1px solid #e0c0c0; color: #94070A;
        font-size: 0.88rem; cursor: pointer; padding: 0.35rem 0.8rem; border-radius: 0.3rem; font-family: inherit;
    }
    .detail-top .tool:hover { background-color: #fbe5e5; }

    .mail-meta { padding: 1.2rem 1.5rem 0.6rem; }
    .mail-meta h1 { font-size: 1.25rem; font-weight: normal; color: #333; margin-bottom: 0.8rem; }
    .meta-row { font-size: 0.92rem; color: #666; line-height: 1.9; }
    .meta-row .lbl { color: #999; }
    .meta-row .val { color: #94070A; }
    .meta-row .gray { color: #999; }

    /* ===== 已读回执（发件人视角） ===== */
    .receipt {
        margin: 0 1.5rem 1rem; background-color: #fdf6f6; border: 1px solid #f0d0d0;
        border-radius: 0.4rem; padding: 0.9rem 1.2rem;
    }
    .receipt .receipt-head { font-size: 0.95rem; color: #94070A; margin-bottom: 0.6rem; }
    .receipt table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .receipt th, .receipt td { padding: 0.45rem 0.6rem; border-bottom: 1px solid #f0e0e0; text-align: left; }
    .receipt th { color: #999; font-weight: normal; }
    .receipt .status-done { color: #0a7a2f; }
    .receipt .status-wait { color: #999; }

    .mail-body { padding: 0.8rem 1.5rem 2rem; font-size: 0.98rem; line-height: 1.8; color: #333; min-height: 10rem; white-space: pre-wrap; word-break: break-word; }

    /* ===== 快捷回复 ===== */
    .quick-reply { border-top: 1px solid #e8e8e8; padding: 1rem 1.5rem; }
    .quick-reply .qr-title { font-size: 0.95rem; color: #94070A; margin-bottom: 0.6rem; }
    .quick-reply textarea {
        width: 100%; min-height: 6rem; border: 1px solid #e0c0c0; border-radius: 0.3rem;
        padding: 0.7rem; font-size: 0.95rem; font-family: inherit; outline: none; resize: vertical;
    }
    .quick-reply textarea:focus { border-color: #94070A; }
    .quick-reply .qr-actions { margin-top: 0.6rem; display: flex; gap: 0.6rem; align-items: center; }
    .quick-reply .btn {
        padding: 0.5rem 1.1rem; font-size: 0.92rem; border-radius: 0.3rem;
        border: 1px solid #c9a0a0; background-color: #fff; color: #94070A;
        cursor: pointer; font-family: inherit;
    }
    .quick-reply .btn:hover { background-color: #fbe5e5; }
    .quick-reply .btn.primary { background: linear-gradient(135deg, #94070A 0%, #c41e22 100%); color: #fff; border: none; }
    .quick-reply .btn.primary:hover { opacity: 0.9; }

    .loading, .error { padding: 4rem 2rem; text-align: center; color: #999; font-size: 1rem; }

    @media (max-width: 900px) {
        .topbar { padding: 0 1.5rem; }
        .layout { flex-direction: column; padding: 1rem; }
        .sidebar { width: 100%; position: static; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
        .sidebar .compose-btn { width: auto; padding: 0.6rem 1.2rem; margin-bottom: 0; }
        .sidebar .nav-item { margin-bottom: 0; padding: 0.5rem 0.8rem; }
        .sidebar .side-title, .sidebar .back-link { display: none; }
    }
    @media (max-width: 600px) {
        .topbar-left .system-name-big { display: none; }
        .receipt table { font-size: 0.82rem; }
    }
</style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left">
        <img src="assets/haigao-logo.jpg" alt="Logo">
        <div class="logo-text">
            <span class="zh">海林市高级中学校友（新海高人）</span>
            <span class="en">Hailin Senior High School Alumni Association</span>
        </div>
        <span class="system-name-big">校友电子邮件系统</span>
    </div>
    <div class="topbar-user">
        <div class="user-avatar" id="userAvatar">—</div>
        <span id="userName">—</span>
    </div>
</header>

<div class="layout">
    <aside class="sidebar">
        <a href="mail-compose.html" class="compose-btn">写信</a>
        <a href="mail-inbox.html" class="nav-item">收件箱<span class="badge" id="inboxBadge" style="display:none">0</span></a>
        <a href="mail-sent.html" class="nav-item">已发送</a>
        <div class="side-title">通讯录</div>
        <a href="mail-contact.html" class="nav-item">个人通讯录</a>
        <a href="member.html" class="back-link">← 返回内网</a>
    </aside>

    <div class="main">
        <div class="detail-top">
            <a class="back" id="backLink" href="mail-inbox.html">← 返回</a>
            <span class="spacer"></span>
            <button class="tool" id="replyBtn" style="display:none" onclick="goReply()">回复</button>
            <button class="tool" id="delBtn" style="display:none" onclick="deleteMail()">删除</button>
        </div>

        <div id="contentBox"><div class="loading">加载中…</div></div>
    </div>
</div>

<script>
const API_BASE_URL = 'https://hailin-alumni-api.onrender.com';
const token = localStorage.getItem('alumniToken');
if (!token) { location.href = 'login.html?redirect=mail-inbox.html'; }

function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (localStorage.getItem('alumniToken') || '') };
}
function fmtTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function applyUser() {
    try {
        const u = JSON.parse(localStorage.getItem('alumniUser') || '{}');
        if (u.name) { document.getElementById('userAvatar').textContent = u.name.slice(-1); document.getElementById('userName').textContent = u.name; }
    } catch (e) {}
}
applyUser();

const mailId = Number(new URLSearchParams(location.search).get('id') || 0);
let mailData = null;

async function loadDetail() {
    const box = document.getElementById('contentBox');
    if (!mailId) { box.innerHTML = '<div class="error">邮件参数缺失</div>'; return; }
    try {
        const resp = await fetch(API_BASE_URL + '/api/mail/' + mailId, { headers: authHeaders() });
        const data = await resp.json();
        if (!resp.ok) { box.innerHTML = '<div class="error">' + (data.message || '邮件不存在') + '</div>'; return; }
        mailData = data;
        render(data);
    } catch (e) {
        box.innerHTML = '<div class="error">网络异常：' + esc(e.message) + '</div>';
    }
}

function render(data) {
    const m = data.mail;
    const backEl = document.getElementById('backLink');
    backEl.href = data.is_sender ? 'mail-sent.html' : 'mail-inbox.html';
    backEl.textContent = data.is_sender ? '← 返回已发送' : '← 返回收件箱';
    document.getElementById('replyBtn').style.display = data.is_sender ? 'none' : 'inline-block';
    document.getElementById('delBtn').style.display = 'inline-block';

    const toDisplay = (data.to || []).map(x => esc(x.name || x.address) + ' <span class="gray">&lt;' + esc(x.address) + '&gt;</span>').join('、');
    const ccList = data.cc || [];
    const ccDisplay = ccList.length ? ccList.map(x => esc(x.name || x.address) + ' <span class="gray">&lt;' + esc(x.address) + '&gt;</span>').join('、') : '';

    let receiptHtml = '';
    if (data.is_sender) {
        const rows = (data.recipients || []).map(x => {
            const st = x.is_read
                ? '<span class="status-done">信件已被对方阅读</span>'
                : '<span class="status-wait">尚未阅读</span>';
            return '<tr><td>' + esc(x.name || '—') + '</td><td>' + esc(x.address) + '</td><td>' + st + '</td><td>' + fmtTime(x.read_at) + '</td></tr>';
        }).join('');
        receiptHtml = '<div class="receipt">'
            + '<div class="receipt-head">对方已阅读 — 共发给 ' + data.to_count + ' 个收件人，其中 ' + data.read_count + ' 个信件已被对方阅读</div>'
            + '<table><thead><tr><th>姓名</th><th>收件人</th><th>状态</th><th>时间</th></tr></thead>'
            + '<tbody>' + rows + '</tbody></table></div>';
    }

    const bodyText = esc(m.body || '（无正文）');

    box.innerHTML = ''
        + '<div class="mail-meta">'
        + '<h1>' + esc(m.subject || '（无主题）') + '</h1>'
        + '<div class="meta-row"><span class="lbl">发件人：</span><span class="val">' + esc(m.sender_name || '—') + '</span> <span class="gray">&lt;' + esc(m.sender_address) + '&gt;</span></div>'
        + '<div class="meta-row"><span class="lbl">收件人：</span>' + (toDisplay || '<span class="gray">—</span>') + '</div>'
        + (ccDisplay ? '<div class="meta-row"><span class="lbl">抄送：</span>' + ccDisplay + '</div>' : '')
        + '<div class="meta-row"><span class="lbl">时间：</span>' + fmtTime(m.sent_at) + '</div>'
        + '</div>'
        + receiptHtml
        + '<div class="mail-body">' + bodyText + '</div>';

    if (!data.is_sender) {
        box.innerHTML += '<div class="quick-reply">'
            + '<div class="qr-title">快捷回复给 ' + esc(m.sender_name || '发件人') + '</div>'
            + '<textarea id="qrText" placeholder="输入回复内容…"></textarea>'
            + '<div class="qr-actions">'
            + '<button class="btn primary" onclick="sendQuickReply()">发送回复</button>'
            + '<button class="btn" onclick="goReply()">回复全部</button>'
            + '</div></div>';
    }
}

function goReply() {
    if (!mailData) return;
    const m = mailData.mail;
    const to = m.sender_address;
    const subject = (m.subject && m.subject.indexOf('Re:') === 0) ? m.subject : 'Re: ' + (m.subject || '');
    location.href = 'mail-compose.html?to=' + encodeURIComponent(to) + '&subject=' + encodeURIComponent(subject);
}

async function sendQuickReply() {
    if (!mailData) return;
    const text = document.getElementById('qrText').value.trim();
    if (!text) { alert('请输入回复内容'); return; }
    const m = mailData.mail;
    const subject = (m.subject && m.subject.indexOf('Re:') === 0) ? m.subject : 'Re: ' + (m.subject || '');
    const payload = {
        to: [m.sender_address],
        subject: subject,
        body: text,
        read_receipt: false
    };
    try {
        const resp = await fetch(API_BASE_URL + '/api/mail/send', {
            method: 'POST', headers: authHeaders(), body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (!resp.ok) { alert(data.message || '发送失败'); return; }
        alert('回复已发送');
        location.href = 'mail-sent.html';
    } catch (e) {
        alert('网络异常：' + e.message);
    }
}

async function deleteMail() {
    if (!mailId || !confirm('确定删除该邮件吗？')) return;
    try {
        await fetch(API_BASE_URL + '/api/mail/' + mailId + '/delete', { method: 'DELETE', headers: authHeaders() });
        alert('邮件已删除');
        location.href = mailData && mailData.is_sender ? 'mail-sent.html' : 'mail-inbox.html';
    } catch (e) {
        alert('网络异常：' + e.message);
    }
}

async function loadBadge() {
    try {
        const resp = await fetch(API_BASE_URL + '/api/mail/unread-count', { headers: authHeaders() });
        const data = await resp.json();
        const badge = document.getElementById('inboxBadge');
        if (data.unread_count > 0) { badge.style.display = 'inline'; badge.textContent = data.unread_count; }
        else { badge.style.display = 'none'; }
    } catch (e) {}
}

loadBadge();
loadDetail();
</script>
</body>
</html>
