<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校友联络 - 海林市高级中学校友（新海高人）</title>
<style>
/* =========================================
   全局：html 基准字号 1.25vw，全站按比例缩放；
   body 顶部留白 8rem 给 fixed 导航栏
   ========================================= */
html { font-size: 1.25vw; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  padding-top: 8rem;
  background: #f7f6f3;
  color: #333;
  font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
}

/* =========================================
   顶部导航栏：北大红渐变，底部透明
   （与首页 index.html 完全一致）
   ========================================= */
.top-navbar {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 8rem;
  background: linear-gradient(
      to bottom,
      rgba(148, 7, 10, 0.95) 0%,
      rgba(148, 7, 10, 0.7) 40%,
      rgba(148, 7, 10, 0.2) 80%,
      rgba(148, 7, 10, 0) 100%
  );
  display: flex; justify-content: center;
  z-index: 1000;
}
.nav-container {
  width: 100%; max-width: 95rem;
  height: 100%; padding: 0 2rem;
  display: flex; justify-content: flex-start; align-items: center;
  position: relative; z-index: 10;
}

/* 左侧 Logo 与文字 */
.nav-logo {
  display: flex; align-items: center;
  color: #fff; text-decoration: none;
  white-space: nowrap; flex-shrink: 0;
  margin-right: 3rem;
}
.nav-logo img {
  height: 4rem; width: 4rem;
  margin-right: 0.8rem;
  border-radius: 50%; object-fit: cover;
  transition: transform 0.3s;
}
.nav-logo:hover img { transform: scale(1.05); }
.logo-text { display: flex; flex-direction: column; justify-content: center; }
.logo-text .zh {
  font-size: 1.1rem; font-weight: 500;
  line-height: 1.4; letter-spacing: 0.03rem;
  white-space: nowrap;
}
.logo-text .en {
  font-size: 0.7rem; opacity: 0.85; margin-top: 0.1rem;
  line-height: 1.4; letter-spacing: 0.01rem;
  white-space: nowrap;
}

/* 右侧整体打包 */
.nav-right-wrapper { display: flex; align-items: center; gap: 1.5rem; margin-left: auto; }
.nav-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.8rem; }

/* 右上角工具栏 */
.top-tools {
  display: flex; align-items: center; gap: 0.8rem;
  font-size: 0.75rem; color: rgba(255, 255, 255, 0.9);
  white-space: nowrap;
}
.top-tools a { color: rgba(255, 255, 255, 0.9); text-decoration: none; transition: all 0.3s; display: flex; align-items: center; gap: 0.25rem; }
.top-tools a:hover { color: #fff; text-shadow: 0 0 0.5rem rgba(255, 255, 255, 0.5); }
.tool-divider { width: 0.0625rem; height: 0.8rem; background-color: rgba(255, 255, 255, 0.3); }
.top-tools a.webvpn { position: relative; }
.top-tools a.webvpn::after {
  content: 'VPN'; position: absolute; top: -0.4rem; right: -0.8rem;
  font-size: 0.45rem; background: #4a6cf7;
  padding: 0.0625rem 0.1875rem; border-radius: 0.125rem;
  transform: scale(0.8); opacity: 0; transition: opacity 0.3s;
}
.top-tools a.webvpn:hover::after { opacity: 1; }
.search-icon { width: 0.9rem; height: 0.9rem; fill: currentColor; cursor: pointer; transition: all 0.3s; }
.search-icon:hover { fill: #fff; transform: scale(1.1); }

/* 右下角主菜单 */
.main-menu { display: flex; align-items: center; gap: 1.2rem; white-space: nowrap; }
.main-menu a {
  color: #fff; text-decoration: none;
  font-size: 1rem; font-weight: 500; letter-spacing: 0.03rem;
  transition: all 0.3s ease;
  position: relative; display: flex; align-items: center; gap: 0.25rem;
  padding-bottom: 0.2rem;
}
.main-menu a::after {
  content: ''; position: absolute; bottom: 0; left: 0;
  width: 0; height: 0.125rem; background-color: #fff;
  transition: width 0.3s ease; border-radius: 0.125rem;
}
.main-menu a:hover::after { width: 100%; }
.arrow-down { width: 0.7rem; height: 0.7rem; fill: rgba(255, 255, 255, 0.7); transition: transform 0.3s; }
.main-menu a:hover .arrow-down { transform: rotate(180deg); fill: #fff; }

/* 三条横线（汉堡菜单） */
.hamburger-menu { display: flex; flex-direction: column; justify-content: space-between; width: 1.6rem; height: 1rem; cursor: pointer; margin-left: 0.5rem; transition: opacity 0.3s; flex-shrink: 0; }
.hamburger-menu:hover { opacity: 0.8; }
.hamburger-line { width: 100%; height: 0.16rem; background-color: #fff; border-radius: 0.08rem; }

/* =========================================
   页面主体：校友联络
   （红色顶边 + 白色标题区 + 白色卡片四选项）
   ========================================= */
.alumni-page { width: 100%; max-width: 95rem; margin: 0 auto; padding: 0 2rem; }

/* 红色顶边 */
.page-top-bar {
  width: 100%; height: 0.5rem;
  background-color: #94070A;
  border-radius: 0.4rem 0.4rem 0 0;
  margin-top: 2rem;
}

/* 白色标题区 */
.page-header {
  background-color: #ffffff;
  padding: 3.5rem 2rem 3rem;
  text-align: center;
  border-radius: 0 0 0.4rem 0.4rem;
}
.page-header h1 {
  margin: 0;
  font-size: 2.75rem;
  color: #94070A;
  font-weight: normal;                 /* 不加粗 */
  font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
  letter-spacing: 0.08em;
}

/* 白色卡片：居中，垂直排列四个选项 */
.page-card {
  background-color: #ffffff;
  max-width: 62rem;
  margin: 2.5rem auto 5rem;
  border-radius: 0.5rem;
  box-shadow: 0 0.6rem 2rem rgba(148, 7, 10, 0.10);
  padding: 1rem 1.5rem;
}
.card-option {
  display: flex; align-items: center; justify-content: center;
  min-height: 5.75rem;
  font-size: 1.6rem;
  color: #94070A;
  font-weight: normal;                 /* 不加粗 */
  text-decoration: none;
  font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
  border-bottom: 1px solid #f4e6e6;
  transition: background-color 0.3s ease;
}
.card-option:last-child { border-bottom: none; }
.card-option:hover { background-color: #fff5f5; }   /* 悬停淡红背景 */

/* 小屏适配：rem 随 1.25vw 自动缩放，这里仅收窄留白 */
@media (max-width: 900px) {
  .alumni-page { padding: 0 1rem; }
  .page-header { padding: 2.5rem 1rem 2.2rem; }
  .page-header h1 { font-size: 2.2rem; }
  .card-option { min-height: 4.75rem; font-size: 1.35rem; }
}
</style>
</head>
<body>

</html>
