<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>校友名录 · 校友风采 - 海林市高级中学校友（新海高人）</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="校友名录 · 校友风采 - 海林市高级中学校友（新海高人）" />

  <meta property="og:url" content="https://xinhaigaoren.github.io/web/alumni.html" />

  <style>
    :root {
      --deep: #183059;
      --deep-2: #274472;
      --accent: #9a6b2f;
      --accent-2: #caa66a;
      --line: #e7eaf0;
      --soft: #f5f7fb;
      --ink: #172033;
      --muted: #657085;
      --radius: 16px;
      --shadow: 0 14px 40px rgba(23, 32, 51, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Serif SC", "Songti SC", "Microsoft YaHei", system-ui, sans-serif; color: var(--ink); background: linear-gradient(180deg, #fbfcfe, #ffffff 40%, #f5f8fc); line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; }

    .site-header { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid var(--line); box-shadow: 0 8px 26px rgba(23,32,51,.05); }
    .header-top { background: var(--deep); color: rgba(255,255,255,.88); font-size: 13px; }
    .top-inner { height: 36px; display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .nav-wrap { max-width: 1200px; margin: 0 auto; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 20px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
    .brand-text strong { display: block; font-size: 19px; letter-spacing: .03em; color: var(--deep); }
    .brand-text small { color: var(--muted); font-size: 12px; }
    .primary-nav { display: flex; gap: 24px; font-size: 15px; color: #2f3b51; }
    .primary-nav a { padding: 6px 2px; font-weight: 600; }
    .primary-nav a:hover, .primary-nav a.current { color: var(--accent); border-bottom: 2px solid var(--accent); }
    .header-actions { display: flex; gap: 10px; font-size: 14px; color: var(--deep); }

    .page-head { background: linear-gradient(135deg, #10243f, #1d3a63 55%, #17345a); color: #fff; padding: 46px 20px 40px; position: relative; overflow: hidden; }
    .page-head::before { content: ""; position: absolute; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(202,166,106,.28), transparent 65%); top: -150px; right: -80px; }
    .page-head .wrap { max-width: 1200px; margin: 0 auto; position: relative; }
    .page-head .en { font-size: 13px; letter-spacing: .3em; color: var(--accent-2); text-transform: uppercase; margin-bottom: 8px; }
    .page-head h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: .05em; }
    .page-head .motto { display: inline-block; margin-top: 12px; padding: 6px 16px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; font-size: 14px; letter-spacing: .2em; color: rgba(255,255,255,.92); }
    .query-strip { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin: -26px auto 26px; max-width: 1200px; position: relative; z-index: 5; box-shadow: var(--shadow); }
    .query-strip h2 { margin: 0; font-size: 15px; color: var(--deep); white-space: nowrap; }
    .query-strip .search-box { flex: 1; min-width: 220px; }
    .big-stats { display: flex; gap: 40px; }
    .big-stats .item b { display: block; font-size: 30px; color: var(--accent); font-weight: 800; line-height: 1.1; }
    .big-stats .item span { font-size: 13px; color: var(--muted); }

    .body { max-width: 1200px; margin: 0 auto; padding: 10px 20px 70px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 24px; box-shadow: var(--shadow); }
    .index-bar { display: flex; flex-wrap: wrap; gap: 8px; }
    .index-bar .chip { padding: 7px 16px; border: 1px solid var(--line); background: #fff; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--deep); cursor: pointer; }
    .index-bar .chip:hover { border-color: var(--accent); color: var(--accent); }
    .index-bar .chip.active { background: var(--deep); color: #fff; border-color: var(--deep); }
    .search-box { flex: 1; min-width: 220px; }
    .search-box input { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 999px; padding: 0 18px; font: inherit; }
    .stats { display: flex; gap: 22px; font-size: 14px; color: var(--muted); }
    .stats strong { color: var(--accent); font-size: 20px; margin-right: 4px; }

    .layout { display: grid; grid-template-columns: 1fr 280px; gap: 26px; align-items: start; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
    .alumni-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; text-align: center; box-shadow: var(--shadow); transition: transform .2s ease, box-shadow .2s ease; }
    .alumni-card:hover { transform: translateY(-5px); box-shadow: 0 22px 50px rgba(23,32,51,.13); }
    .avatar { width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800; color: #fff; }
    .alumni-card h3 { margin: 0 0 4px; color: var(--deep); font-size: 18px; }
    .alumni-card .college { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .alumni-card .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
    .alumni-card .tag { background: #f0e8da; color: var(--accent); font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
    .alumni-card .updated { color: #9aa6b8; font-size: 12px; }

    .side-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .side-card h3 { margin: 0 0 12px; font-size: 16px; color: var(--deep); border-left: 4px solid var(--accent); padding-left: 10px; }
    .side-list { list-style: none; margin: 0; padding: 0; }
    .side-list li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 14px; cursor: pointer; }
    .side-list li:hover { color: var(--accent); }
    .side-list small { color: #9aa6b8; white-space: nowrap; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .auth-hint { text-align: center; padding: 50px 20px; }
    .auth-hint .btn { display: inline-block; margin-top: 14px; padding: 10px 26px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal-card { background: #fff; border-radius: 16px; max-width: 540px; width: 100%; max-height: 86vh; overflow: auto; padding: 28px; position: relative; box-shadow: 0 24px 60px rgba(23,32,51,.25); }
    .modal-close { position: absolute; top: 12px; right: 16px; border: 0; background: none; font-size: 28px; line-height: 1; cursor: pointer; color: var(--muted); }
    .modal-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
    .modal-detail-grid .item small { color: var(--muted); display: block; margin-bottom: 2px; }
    .modal-detail-grid .item strong { color: var(--deep); word-break: break-all; }

    .footer { border-top: 1px solid var(--line); background: #fff; text-align: center; color: var(--muted); font-size: 13px; padding: 26px 20px; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .side-card { order: -1; } .primary-nav { display: none; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-top"><div class="top-inner"><span>连接母校 · 凝聚校友 · 服务社会</span><span>校友登录 / 加入新海高人</span></div></div>
    <div class="nav-wrap">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/haigao-logo.jpg" alt="校徽" />
        <span class="brand-text"><strong>海林市高级中学校友（新海高人）</strong><small>Hailin Senior High School Alumni</small></span>
      </a>
      <nav class="primary-nav">
        <a href="index.html">首页</a>
        <a href="about.html">校友会介绍</a>
        <a href="alumni.html" class="current">校友风采</a>
        <a href="news.html">新闻公告</a>
        <a href="account.html">加入我们</a>
      </nav>
    </div>
  </header>

  <section class="page-head">
    <div class="wrap">
      <p class="en">Alumni Directory &amp; Showcase</p>
      <h1>校友名录 · 校友风采</h1>
      <p style="color:rgba(255,255,255,.85)">新海高人 · 桃李满天下 —— 认识活跃在各行各业的海高校友</p>
      <span class="motto">共忆青春海高路 · 同筑未来校友情</span>
    </div>
  </section>

  <div class="query-strip">
    <h2>校友查询</h2>
    <div class="search-box"><input id="searchInput" placeholder="请输入校友姓名或关键字" /></div>
    <div class="big-stats">
      <div class="item"><b id="statTotal">0</b><span>已开通主页校友人数</span></div>
      <div class="item"><b id="statRecent">0</b><span>近期更新的校友人数</span></div>
    </div>
  </div>

  <main class="body">
    <div class="toolbar">
      <div class="index-bar" id="yearBar"></div>
    </div>
    <div class="auth-hint" id="authHint" hidden>
      <p>请先登录并完成校友认证后，查看校友风采。</p>
      <a class="btn" href="account.html">去登录 / 注册</a>
    </div>

    <div class="layout">
      <div class="card-grid" id="cardGrid"></div>
      <aside class="side-card">
        <h3>最新认证</h3>
        <ul class="side-list" id="sideList"></ul>
      </aside>
    </div>
  </main>

  <div class="modal-overlay" id="alumniModal">
    <div class="modal-card">
      <button class="modal-close" id="alumniModalClose" type="button">×</button>
      <div id="alumniModalBody"></div>
    </div>
  </div>

  <footer class="footer">© 2026 海林市高级中学校友（新海高人）· 校友个人主页</footer>

  <script>
    const XH = window.XH;
    const grid = document.getElementById('cardGrid');
    const sideList = document.getElementById('sideList');
    const searchInput = document.getElementById('searchInput');
    const yearBar = document.getElementById('yearBar');
    const authHint = document.getElementById('authHint');
    let alumni = [];
    let currentYear = '';
    let currentQuery = '';
    const palette = ['#274472', '#3a5f8a', '#9a6b2f', '#4a7ba6', '#6b4f8a', '#2f7d6a', '#a6532f', '#3f6fa8'];

    function initial(name) { return name ? name[0] : '?'; }
    function avatarColor(id) { return palette[(id || 0) % palette.length]; }
    function filtered() {
      let list = alumni.slice();
      if (currentYear) list = list.filter(a => String(a.graduation_year || '') === currentYear);
      const q = currentQuery.trim().toLowerCase();
      if (q) list = list.filter(a => (a.name || '').toLowerCase().includes(q) || (a.company || '').toLowerCase().includes(q) || (a.class_name || '').toLowerCase().includes(q) || (a.industry || '').toLowerCase().includes(q) || (a.position_title || '').toLowerCase().includes(q));
      return list;
    }
    function renderYears() {
      const years = [...new Set(alumni.map(a => a.graduation_year).filter(Boolean))].sort((a, b) => String(b).localeCompare(String(a)));
      yearBar.innerHTML = `<span class="chip${currentYear === '' ? ' active' : ''}" data-year="">全部</span>` +
        years.map(y => `<span class="chip${currentYear === y ? ' active' : ''}" data-year="${y}">${y}届</span>`).join('');
      yearBar.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        currentYear = c.dataset.year;
        render();
      }));
    }
    function render() {
      const list = filtered();
      document.getElementById('statTotal').textContent = alumni.length;
      document.getElementById('statRecent').textContent = new Set(alumni.map(a => a.graduation_year).filter(Boolean)).size;
      grid.innerHTML = list.length ? list.map((a, i) => {
        const tags = [a.graduation_year ? `${a.graduation_year}届` : '', a.class_name || '', a.position_title || '', a.industry || ''].filter(Boolean);
        return `
          <article class="alumni-card" data-i="${i}" style="cursor:pointer">
            <div class="avatar" style="background:linear-gradient(135deg, ${avatarColor(a.id)}, ${avatarColor((a.id || 0) + 2)})">${initial(a.name)}</div>
            <h3>${XH.escapeHtml(a.name)}</h3>
            <div class="college">${XH.escapeHtml([a.company, a.position_title].filter(Boolean).join(' · ')) || '—'}</div>
            <div class="tags">${tags.slice(0, 3).map(t => `<span class="tag">${XH.escapeHtml(t)}</span>`).join('')}</div>
            <div class="updated">点击查看详情</div>
          </article>`;
      }).join('') : '<div class="empty">没有匹配的校友</div>';
      sideList.innerHTML = alumni.slice(0, 8).map(a =>
        `<li data-i="${alumni.indexOf(a)}"><span>${XH.escapeHtml(a.name)}</span><small>${XH.escapeHtml(a.graduation_year ? a.graduation_year + '届' : '')}</small></li>`
      ).join('');
      document.querySelectorAll('[data-i]').forEach(el => el.addEventListener('click', () => openDetail(alumni[Number(el.dataset.i)])));
    }
    function openDetail(item) {
      if (!item) return;
      const rows = [
        ['入学年份', item.enrollment_year], ['毕业年份', item.graduation_year], ['班级', item.class_name], ['班主任', item.homeroom_teacher],
        ['现居地区', [item.current_province, item.current_city].filter(Boolean).join(' ')], ['籍贯', [item.province, item.city, item.county].filter(Boolean).join(' ')],
        ['单位', item.company], ['职务', item.position_title], ['行业', item.industry], ['联系电话', item.phone], ['邮箱', item.email]
      ].filter(r => r[1]);
      const gridHtml = rows.map(([k, v]) => `<div class="item"><small>${XH.escapeHtml(k)}</small><strong>${XH.escapeHtml(String(v))}</strong></div>`).join('');
      const bioHtml = item.bio ? `<div class="item" style="grid-column:1/-1"><small>个人简介</small><p style="margin:4px 0 0;white-space:pre-wrap">${XH.escapeHtml(item.bio)}</p></div>` : '';
      document.getElementById('alumniModalBody').innerHTML = `
        <h3 style="margin:0 0 12px;color:var(--deep)">${XH.escapeHtml(item.name)}</h3>
        <div class="modal-detail-grid">${gridHtml}${bioHtml}</div>`;
      document.getElementById('alumniModal').classList.add('show');
    }
    async function load() {
      try {
        const data = await XH.api('/api/alumni/directory?t=' + Date.now());
        alumni = data.alumni || [];
        authHint.hidden = true;
        renderYears();
        render();
      } catch (error) {
        const me = XH.store.getUser();
        const p = authHint.querySelector('p');
        const link = authHint.querySelector('a');
        if (error.status === 401 || error.status === 403) {
          authHint.hidden = false;
          p.textContent = '请先登录并完成校友认证后，查看校友风采。';
          link.style.display = '';
        } else if (me && me.name) {
          authHint.hidden = false;
          p.textContent = error.message || '服务暂不可用（后端可能正在启动），请稍后刷新重试。';
          link.style.display = 'none';
        } else {
          authHint.hidden = false;
          p.textContent = '请先登录并完成校友认证后，查看校友风采。';
          link.style.display = '';
        }
      }
    }
    document.getElementById('alumniModalClose').addEventListener('click', () => document.getElementById('alumniModal').classList.remove('show'));
    document.getElementById('alumniModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('show'); });
    searchInput.addEventListener('input', () => { currentQuery = searchInput.value; render(); });
    load();
  </script>
</body>
</html>
