<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收件箱 - 电子邮件系统</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 1vw; }
    body {
        font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #f4f4f4;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* ========== 顶部导航栏 ========== */
    .topbar {
        width: 100%; height: 5.5rem;
        background-color: #94070A;
        display: flex; align-items: center;
        padding: 0 2rem; gap: 0.5rem;
    }
    .topbar-left { display: flex; align-items: center; gap: 0.8rem; white-space: nowrap; }
    .topbar-left img {
        height: 3rem; width: 3rem;
        border-radius: 50%; object-fit: contain;
        background-color: rgba(255,255,255,0.08);
    }
    .topbar-left .logo-text { display: flex; flex-direction: column; color: #fff; }
    .topbar-left .logo-text .zh { font-size: 1rem; line-height: 1.3; }
    .topbar-left .logo-text .en { font-size: 0.7rem; opacity: 0.85; line-height: 1.3; }
    .topbar-left .system-name-big {
        font-size: 1.8rem; color: #fff;
        font-weight: normal; letter-spacing: 0.05rem;
        margin-left: 1rem;
    }
    .topbar-spacer { flex: 1; }
    .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; }
    .topbar-tools {
        display: flex; align-items: center; gap: 1.2rem;
        color: #fff; font-size: 0.9rem; white-space: nowrap;
    }
    .topbar-tools a {
        color: #fff; text-decoration: none;
        display: flex; align-items: center; gap: 0.3rem;
        opacity: 0.9; transition: opacity 0.3s;
    }
    .topbar-tools a:hover { opacity: 1; }
    .topbar-tools svg { width: 0.95rem; height: 0.95rem; fill: #fff; }
    .topbar-menu {
        display: flex; align-items: center; gap: 1.8rem;
        font-size: 1.3rem; color: #fff; white-space: nowrap;
    }
    .topbar-menu a {
        color: #fff; text-decoration: none;
        position: relative; padding-bottom: 0.3rem;
        border-bottom: 1px solid transparent;
        opacity: 0.92;
        transition: border-color 0.3s, opacity 0.3s;
    }
    .topbar-menu a:hover { border-bottom-color: #fff; opacity: 1; }
    .topbar-menu a.active { opacity: 1; }

    /* ========== 主体布局 ========== */
    .main-layout { flex: 1; display: flex; background-color: #ffffff; }

    .sidebar {
        width: 12rem;
        background-color: #f5f5f5;
        border-right: 1px solid #e0e0e0;
        padding: 1rem 0;
        display: flex; flex-direction: column;
    }
    .sidebar-btn {
        display: flex; align-items: center; gap: 0.5rem;
        padding: 0.7rem 1rem;
        font-size: 0.9rem; color: #333;
        text-decoration: none;
        border-left: 3px solid transparent;
        transition: all 0.3s;
    }
    .sidebar-btn:hover { background-color: #ebebeb; color: #94070A; }
    .sidebar-btn.active {
        background-color: #ffffff;
        border-left-color: #94070A;
        color: #94070A;
        font-weight: bold;
    }
    .sidebar-btn svg { width: 1rem; height: 1rem; fill: currentColor; }
    .sidebar-btn .badge {
        margin-left: auto;
        background-color: #94070A;
        color: #fff;
        font-size: 0.7rem;
        padding: 0.1rem 0.4rem;
        border-radius: 0.6rem;
        min-width: 1rem; height: 1rem;
        display: inline-block;
    }

    .content-area {
        flex: 1;
        padding: 1rem 1.5rem;
        overflow-y: auto;
    }

    /* 工具栏 */
    .toolbar {
        display: flex; align-items: center;
        gap: 0.5rem;
        padding-bottom: 0.8rem;
        border-bottom: 1px solid #e8e8e8;
        margin-bottom: 1rem;
        flex-wrap: wrap;
    }
    .toolbar select,
    .toolbar button {
        padding: 0.4rem 0.8rem;
        font-size: 0.85rem;
        border: 1px solid #d0d0d0;
        border-radius: 0.2rem;
        background-color: #fff;
        color: #333;
        cursor: pointer;
        font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        transition: all 0.3s;
    }
    .toolbar button:hover, .toolbar select:hover {
        border-color: #94070A; color: #94070A;
    }
    .toolbar-right {
        margin-left: auto;
        display: flex; align-items: center; gap: 0.6rem;
        font-size: 0.85rem; color: #666;
    }
    .toolbar-right button { padding: 0.2rem 0.5rem; }

    /* 邮件列表 */
    .mail-table { width: 100%; border-collapse: collapse; }
    .mail-table th {
        text-align: left;
        padding: 0.6rem 0.8rem;
        font-size: 0.85rem; color: #666; font-weight: normal;
        border-bottom: 1px solid #e0e0e0;
    }
    .mail-table td {
        padding: 0.8rem; font-size: 0.9rem;
        border-bottom: 1px solid #f0f0f0;
        vertical-align: middle;
        color: #333;
    }
    .mail-table tr.mail-row { cursor: pointer; }
    .mail-table tr.mail-row:hover { background-color: #fafafa; }
    .mail-table tr.unread td { font-weight: bold; }
    .mail-table .from { width: 14rem; }
    .mail-table .subject { color: #333; }
    .mail-table .preview { color: #999; font-weight: normal; margin-left: 0.4rem; font-size: 0.8rem; }
    .mail-table .date { text-align: right; color: #999; font-size: 0.8rem; width: 6rem; }
    .mail-table .checkbox { width: 2rem; }

    .empty-tip { text-align: center; color: #999; padding: 3rem 0; font-size: 0.95rem; }
    .toast {
        position: fixed; top: 6rem; left: 50%; transform: translateX(-50%);
        background: #333; color: #fff; padding: 0.6rem 1.4rem; border-radius: 0.3rem;
        font-size: 0.9rem; z-index: 99; display: none;
    }

    /* ========== 浏览器适配 ========== */
    @media (max-width: 1280px) {
        .topbar { height: 5rem; padding: 0 1.4rem; }
        .topbar-menu { font-size: 1.2rem; gap: 1.4rem; }
        .system-name-big { font-size: 1.6rem; }
        .sidebar { width: 11rem; }
    }
    @media (max-width: 1024px) {
        .topbar { height: 4.6rem; }
        .topbar-menu { font-size: 1.05rem; gap: 1rem; }
        .topbar-left .logo-text .en { display: none; }
        .sidebar { width: 10rem; }
        .content-area { padding: 1rem 1.2rem; }
    }
    @media (max-width: 820px) {
        .topbar { flex-wrap: wrap; height: auto; padding: 0.6rem 1rem; gap: 0.4rem; }
        .topbar-right { flex: 1; min-width: 0; align-items: stretch; }
        .topbar-menu { font-size: 0.95rem; gap: 0.8rem; flex-wrap: wrap; }
        .topbar-tools { font-size: 0.8rem; gap: 0.8rem; }
        .system-name-big { font-size: 1.3rem; }
        .main-layout { flex-direction: column; }
        .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid #e0e0e0; padding: 0.5rem; }
        .sidebar-btn { padding: 0.5rem 0.8rem; border-left: none; border-bottom: 2px solid transparent; }
        .sidebar-btn.active { border-bottom-color: #94070A; border-left: none; }
    }
</style>
</head>
<body>

<!-- ========== 顶部导航栏 ========== -->
<header class="topbar">
    <div class="topbar-left">
        <img src="assets/haigao-logo.jpg" alt="Logo">
        <div class="logo-text">
            <span class="zh">海林市高级中学校友（新海高人）</span>
            <span class="en">Hailin Senior High School Alumni Association</span>
        </div>
        <span class="system-name-big">电子邮件系统</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-right">
        <div class="topbar-tools">
            <a href="member.html">内网系统</a>
            <a href="index.html">校友官网</a>
        </div>
        <nav class="topbar-menu">
            <a href="mail-inbox.html" class="active">收件箱</a>
            <a href="mail-sent.html">已发送</a>
            <a href="mail-drafts.html">草稿箱</a>
            <a href="mail-compose.html">写信</a>
            <a href="mail-todo.html">待办邮件</a>
            <a href="mail-contact.html">其他文件夹</a>
        </nav>
    </div>
</header>

<!-- ========== 主体 ========== -->
<div class="main-layout">
    <aside class="sidebar">
        <a href="mail-compose.html" class="sidebar-btn">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg>
            写信
        </a>
        <a href="mail-inbox.html" class="sidebar-btn active inbox">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/></svg>
            收件箱<span class="badge" id="inboxBadge" style="display:none;"></span>
        </a>
        <a href="mail-todo.html" class="sidebar-btn todo">
            <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            待办邮件
        </a>
        <a href="mail-drafts.html" class="sidebar-btn drafts">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            草稿箱
        </a>

        <a href="mail-sent.html" class="sidebar-btn sent">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            已发送
        </a>
        <a href="mail-contact.html" class="sidebar-btn">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            联系人
        </a>
        <a href="mail-contact.html" class="sidebar-btn">其他文件夹</a>
    </aside>

    <section class="content-area">

        <div class="toolbar">
            <button id="refreshBtn">刷新</button>
            <button id="markReadBtn">标记为已读</button>
            <button id="deleteBtn">删除</button>
            <div class="toolbar-right">
                <span id="pageInfo">共 0 封</span>
            </div>
        </div>

        <table class="mail-table">
            <thead>
                <tr>
                    <th class="checkbox"><input type="checkbox" id="checkAll"></th>
                    <th class="from">发件人</th>
                    <th class="subject">主题</th>
                    <th class="date">日期</th>
                </tr>
            </thead>
            <tbody id="mailBody"></tbody>
        </table>
        <div class="empty-tip" id="emptyTip" style="display:block;">正在加载邮件…</div>

    </section>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
    var API = 'https://hailin-alumni-api.onrender.com';
    function getToken(){ return localStorage.getItem('alumniToken') || ''; }
    if (!getToken()) { location.href = 'login.html?redirect=mail-inbox.html'; return; }

    var checkedIds = new Set();
    var mailBody = document.getElementById('mailBody');
    var emptyTip = document.getElementById('emptyTip');
    var toast = document.getElementById('toast');
    function showToast(t){ toast.textContent = t; toast.style.display = 'block'; clearTimeout(showToast._t); showToast._t = setTimeout(function(){ toast.style.display = 'none'; }, 2200); }

    function fmtDate(iso){
        if (!iso) return '';
        var d = new Date(iso);
        var p = function(n){ return (n < 10 ? '0' : '') + n; };
        return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    function render(mails){
        checkedIds.clear();
        mailBody.innerHTML = '';
        emptyTip.textContent = '收件箱为空，暂无邮件';
        emptyTip.style.display = mails.length ? 'none' : 'block';
        document.getElementById('pageInfo').textContent = '共 ' + mails.length + ' 封';
        var unread = mails.filter(function(m){ return !m.is_read; }).length;
        var badge = document.getElementById('inboxBadge');
        if (unread > 0) { badge.textContent = unread; badge.style.display = 'inline-block'; } else { badge.style.display = 'none'; }
        mails.forEach(function(m){
            var tr = document.createElement('tr');
            tr.className = 'mail-row' + (m.is_read ? '' : ' unread');
            tr.dataset.id = m.id;
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.addEventListener('click', function(e){ e.stopPropagation(); if (cb.checked) checkedIds.add(m.id); else checkedIds.delete(m.id); });
            var tdCb = document.createElement('td'); tdCb.className = 'checkbox'; tdCb.appendChild(cb);
            var tdF = document.createElement('td'); tdF.className = 'from'; tdF.textContent = m.from || '';
            var tdS = document.createElement('td'); tdS.className = 'subject'; tdS.textContent = m.subject || '（无主题）';
            var span = document.createElement('span'); span.className = 'preview'; span.textContent = m.body ? (String(m.body).slice(0,40)) : '';
            tdS.appendChild(span);
            var tdD = document.createElement('td'); tdD.className = 'date'; tdD.textContent = fmtDate(m.sent_at);
            tr.appendChild(tdCb); tr.appendChild(tdF); tr.appendChild(tdS); tr.appendChild(tdD);
            tr.addEventListener('click', function(){ location.href = 'mail-detail.html?id=' + m.id; });
            mailBody.appendChild(tr);
        });
    }

    function load(){
        fetch(API + '/api/mail/inbox', { headers: { 'Authorization': 'Bearer ' + getToken() } })
            .then(function(r){ return r.json(); })
            .then(function(j){
                if (!j.ok) { showToast(j.message || '加载失败'); return; }
                render(j.mails || []);
            })
            .catch(function(){ showToast('网络异常，请稍后重试'); });
    }

    document.getElementById('refreshBtn').addEventListener('click', load);
    document.getElementById('checkAll').addEventListener('change', function(){
        var all = document.querySelectorAll('#mailBody input[type=checkbox]');
        var self = this;
        all.forEach(function(cb){
            cb.checked = self.checked;
            var id = Number(cb.closest('tr').dataset.id);
            if (self.checked) checkedIds.add(id); else checkedIds.delete(id);
        });
    });
    document.getElementById('deleteBtn').addEventListener('click', function(){
        if (!checkedIds.size) { showToast('请先勾选要删除的邮件'); return; }
        var arr = Array.from(checkedIds);
        Promise.all(arr.map(function(id){
            return fetch(API + '/api/mail/' + id + '/delete', { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + getToken() } });
        })).then(function(){ showToast('已删除 ' + arr.length + ' 封邮件'); load(); });
    });
    document.getElementById('markReadBtn').addEventListener('click', function(){
        if (!checkedIds.size) { showToast('请先勾选邮件'); return; }
        var arr = Array.from(checkedIds);
        var i = 0;
        function next(){
            if (i >= arr.length) { showToast('已标记为已读'); load(); return; }
            fetch(API + '/api/mail/' + arr[i], { headers: { 'Authorization': 'Bearer ' + getToken() } })
                .then(function(){ i++; next(); });
        }
        next();
    });

    load();
})();
</script>
</body>
</html>
