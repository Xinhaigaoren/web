<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重置密码 - 海林市高级中学校友（新海高人）</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: clamp(11px, 1.05vw, 14px); }
    body { font-family: "Microsoft YaHei", "微软雅黑", sans-serif; background: linear-gradient(135deg, #94070A 0%, #c41e22 40%, #e85d5d 100%); min-height: 100vh; display: flex; flex-direction: column; }
    .top-bar { width: 100%; height: 4.5rem; background-color: rgba(148,7,10,0.85); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; box-shadow: 0 0.2rem 0.6rem rgba(0,0,0,0.15); }
    .top-bar-left { display: flex; align-items: center; gap: 1rem; }
    .top-bar-left .logo-circle { height: 3rem; width: 3rem; object-fit: contain; border-radius: 50%; filter: drop-shadow(0 0.2rem 0.4rem rgba(0,0,0,0.3)); }
    .top-bar-left .logo-text-area { display: flex; flex-direction: column; justify-content: center; color: #ffffff; white-space: nowrap; }
    .top-bar-left .logo-text-area .zh { font-size: 1.1rem; font-weight: normal; line-height: 1.3; letter-spacing: 0.05rem; }
    .top-bar-left .logo-text-area .en { font-size: 0.8rem; font-weight: normal; line-height: 1.3; opacity: 0.9; letter-spacing: 0.02rem; margin-top: 0.1rem; }
    .top-bar-right { display: flex; align-items: center; gap: 2rem; font-size: 0.9rem; color: #ffffff; }
    .top-bar-right a { color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; }
    .top-bar-right svg { width: 0.8rem; height: 0.8rem; fill: #ffffff; }
    .main-wrapper { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 2.5rem 1.5rem; }
    .reset-panel { width: 100%; max-width: 58rem; background: linear-gradient(135deg, #ffe8e0 0%, #ffd8d0 100%); border-radius: 0.5rem; box-shadow: 0 0.5rem 2rem rgba(0,0,0,0.15); padding: 2.5rem 3rem; margin: auto 0; }
    .reset-title { font-size: 1.5rem; color: #333; margin-bottom: 1.5rem; font-weight: normal; letter-spacing: 0.1rem; }
    .form-group { margin-bottom: 1rem; max-width: 42rem; }
    .form-group label { display: block; font-size: 0.95rem; color: #333; margin-bottom: 0.5rem; }
    .form-group input { width: 100%; padding: 0.7rem 0.9rem; font-size: 0.95rem; border: 1px solid #e0c8c0; border-radius: 0.3rem; outline: none; background-color: #ffffff; font-family: "Microsoft YaHei", "微软雅黑", sans-serif; }
    .form-group input:focus { border-color: #94070A; }
    .form-group input::placeholder { color: #b0b0b0; }
    .captcha-row { display: flex; align-items: center; gap: 0.8rem; max-width: 42rem; margin-bottom: 1.2rem; }
    .captcha-row input { flex: 1; padding: 0.7rem 0.9rem; font-size: 0.95rem; border: 1px solid #e0c8c0; border-radius: 0.3rem; outline: none; background-color: #ffffff; font-family: "Microsoft YaHei", "微软雅黑", sans-serif; }
    .captcha-img { width: 7rem; height: 2.8rem; background-color: #f5f5f5; border: 1px solid #e0c8c0; border-radius: 0.3rem; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; color: #4a8c4a; letter-spacing: 0.5rem; font-family: "Courier New", monospace; cursor: pointer; user-select: none; position: relative; overflow: hidden; }
    .captcha-img::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background-color: #4a8c4a; opacity: 0.3; }
    .refresh-btn { background: none; border: none; cursor: pointer; padding: 0.3rem; display: flex; align-items: center; justify-content: center; transition: transform 0.3s; }
    .refresh-btn:hover { transform: rotate(180deg); }
    .refresh-btn svg { width: 1.4rem; height: 1.4rem; fill: #94070A; }
    .submit-btn { padding: 0.7rem 2.5rem; font-size: 1rem; font-weight: normal; color: #ffffff; background: #3da8b8; border: none; border-radius: 0.3rem; cursor: pointer; transition: all 0.3s; font-family: "Microsoft YaHei", "微软雅黑", sans-serif; letter-spacing: 0.1rem; }
    .submit-btn:hover { background: #2d8a98; box-shadow: 0 0.4rem 1rem rgba(61,168,184,0.4); }
    .service-footer { width: 100%; max-width: 58rem; margin: 0 auto; padding: 1.5rem 2rem 2rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: #ffffff; }
    .service-item { display: flex; align-items: center; gap: 0.4rem; }</style>
  <link rel="icon" href="assets/favicon.png" />
</head>
<body>

<div class="top-bar">
    <div class="top-bar-left">
        <img src="assets/haigao-logo.jpg" alt="Logo" class="logo-circle">
        <div class="logo-text-area">
            <span class="zh">海林市高级中学校友（新海高人）</span>
            <span class="en">Hailin Senior High School Alumni Association</span>
        </div>
    </div>
    <div class="top-bar-right">
        <a href="#">中文 <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></a>
        <a href="login.html">登录</a>
    </div>
</div>

<div class="main-wrapper">
    <div class="reset-panel">
        <h1 class="reset-title">重置密码</h1>
        <form id="resetForm">
            <div class="form-group">
                <label>请输入注册邮箱</label>
                <input type="text" id="accountInput" placeholder="用户名/电话号/校友电子卡号（使用注册邮箱重置）" autocomplete="off">
            </div>
            <div class="captcha-row">
                <input type="text" placeholder="图形验证码" id="captchaInput" autocomplete="off">
                <div class="captcha-img" id="captchaImg">S83X</div>
                <button type="button" class="refresh-btn" id="refreshBtn" title="刷新验证码">
                    <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </button>
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="newPassword" placeholder="请输入新密码（至少 8 位）" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="请再次输入新密码" autocomplete="new-password">
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">确定</button>
        </form>
    </div>
</div>

<div class="service-footer">
    <div class="service-item"><span>服务邮箱：xinhaigaoren@126.com</span></div>
    <div class="service-item"><span>每天 9:00-20:00（节假日除外）</span></div>
</div>

<script>
    const API_BASE_URL = 'https://hailin-alumni-api.onrender.com';
    const captchaImg = document.getElementById('captchaImg');
    const refreshBtn = document.getElementById('refreshBtn');
    const captchaChars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let captchaText = '';
    function generateCaptcha() {
        captchaText = '';
        for (let i = 0; i < 4; i++) {
            captchaText += captchaChars.charAt(Math.floor(Math.random() * captchaChars.length));
        }
        captchaImg.textContent = captchaText;
    }
    refreshBtn.addEventListener('click', generateCaptcha);
    captchaImg.addEventListener('click', generateCaptcha);
    generateCaptcha();

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const account = document.getElementById('accountInput').value.trim();
        const captcha = document.getElementById('captchaInput').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const submitBtn = document.getElementById('submitBtn');

        if (captcha.toLowerCase() !== captchaText.toLowerCase()) { alert('图形验证码不正确，请重新输入'); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(account)) { alert('重置密码需使用注册邮箱，请输入您的注册邮箱地址'); return; }
        if (!newPassword || newPassword.length < 8) { alert('新密码长度至少 8 位'); return; }
        if (newPassword !== confirmPassword) { alert('两次输入的新密码不一致'); return; }

        submitBtn.disabled = true;
        submitBtn.textContent = '提交中...';
        try {
            // 1) 生成重置码（后端返回 8 位激活码）
            const forgotResp = await fetch(API_BASE_URL + '/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: account })
            });
            const forgotData = await forgotResp.json();
            if (!forgotResp.ok) { alert(forgotData.message || '获取重置码失败'); return; }
            // 2) 使用激活码直接设置新密码
            const resetResp = await fetch(API_BASE_URL + '/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: account, token: forgotData.reset_code, password: newPassword })
            });
            const resetData = await resetResp.json();
            if (!resetResp.ok) { alert(resetData.message || '重置失败'); return; }
            alert('密码重置成功！请使用新密码登录。');
            location.href = 'login.html';
        } catch (err) {
            alert('网络异常，请稍后重试（' + err.message + '）');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '确定';
        }
    });
</script>

</body>
</html>
