<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>已发送 - 校友电子邮件系统 - 新海高人</title>
<link rel="icon" href="assets/favicon.png">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: clamp(12px, 1vw, 18px); }
    body {
        font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #f4f4f4;
        min-height: 100vh;
    }

    /* ===== 顶部导航 ===== */
    .topbar {
        width: 100%; height: 5.5rem;
        background-color: #94070A;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 3rem;
    }
    .topbar-left { display: flex; align-items: center; gap: 1rem; white-space: nowrap; }
    .topbar-left img { height: 3.2rem; width: 3.2rem; border-radius: 50%; object-fit: contain; background-color: rgba(255,255,255,0.08); }
    .topbar-left .logo-text { display: flex; flex-direction: column; color: #fff; }
    .topbar-left .logo-text .zh { font-size: 1.1rem; line-height: 1.3; }
    .topbar-left .logo-text .en { font-size: 0.75rem; opacity: 0.85; line-height: 1.3; }
    .topbar-left .system-name-big { font-size: 2rem; color: #fff; font-weight: normal; letter-spacing: 0.05rem; margin-left: 1.5rem; }
    .topbar-user { display: flex; align-items: center; gap: 0.6rem; color: #fff; font-size: 0.9rem; }
    .topbar-user .user-avatar {
        width: 2.2rem; height: 2.2rem; border-radius: 50%;
        background-color: #fff; display: flex; align-items: center; justify-content: center;
        color: #94070A; font-weight: bold; font-size: 0.95rem;
    }

    /* ===== 主体布局 ===== */
    .layout { display: flex; max-width: 95rem; margin: 0 auto; padding: 1.5rem 2rem; gap: 1.5rem; align-items: flex-start; }
    .sidebar {
        width: 12.5rem; flex-shrink: 0;
        background-color: #fff; border-radius: 0.5rem;
        border: 1px solid #e8e8e8; padding: 1.2rem 0.8rem;
        position: sticky; top: 1.5rem;
    }
    .sidebar .compose-btn {
        display: block; width: 100%; text-align: center;
        background: linear-gradient(135deg, #94070A 0%, #c41e22 100%);
        color: #fff; text-decoration: none; border-radius: 0.35rem;
        padding: 0.75rem 0; font-size: 1rem; letter-spacing: 0.1rem;
        margin-bottom: 1.2rem;
    }
    .sidebar .compose-btn:hover { opacity: 0.9; }
    .sidebar .nav-item {
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.65rem 0.9rem; border-radius: 0.35rem;
        color: #333; text-decoration: none; font-size: 0.95rem;
        margin-bottom: 0.25rem; cursor: pointer;
    }
    .sidebar .nav-item:hover { background-color: #fbe5e5; color: #94070A; }
    .sidebar .nav-item.active { background-color: #94070A; color: #fff; }
    .sidebar .nav-item .badge {
        background-color: #e00; color: #fff; font-size: 0.7rem;
        border-radius: 0.8rem; padding: 0.05rem 0.45rem; min-width: 1.2rem; text-align: center;
    }
    .sidebar .side-title { font-size: 0.8rem; color: #999; padding: 0.6rem 0.9rem 0.3rem; }
    .sidebar .back-link {
        display: block; margin-top: 1rem; padding: 0.6rem 0.9rem;
        font-size: 0.85rem; color: #666; text-decoration: none;
        border-top: 1px solid #eee;
    }
    .sidebar .back-link:hover { color: #94070A; }

    .main { flex: 1; min-width: 0; background-color: #fff; border-radius: 0.5rem; border: 1px solid #e8e8e8; }

    /* ===== 已发送 ===== */
    .mail-header { display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.5rem; border-bottom: 1px solid #e8e8e8; }
    .mail-header h2 { font-size: 1.2rem; font-weight: normal; color: #333; }
    .mail-header .tool { background: none; border: none; color: #94070A; font-size: 0.9rem; cursor: pointer; font-family: inherit; padding: 0.3rem 0.5rem; border-radius: 0.3rem; }
    .mail-header .tool:hover { background-color: #fbe5e5; }
    .mail-header .spacer { flex: 1; }

    .mail-list { width: 100%; }
    .mail-row {
        display: grid; grid-template-columns: 14rem 1fr 7rem 6rem;
        align-items: center; gap: 0.6rem;
        padding: 0.8rem 1.5rem; border-bottom: 1px solid #f0f0f0;
        text-decoration: none; color: #333; cursor: pointer;
    }
    .mail-row:hover { background-color: #faf5f5; }
    .mail-row .to { font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mail-row .subject-line { font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mail-row .read-stat { font-size: 0.85rem; color: #666; text-align: center; white-space: nowrap; }
    .mail-row .read-stat .done { color: #0a7a2f; }
    .mail-row .time { font-size: 0.85rem; color: #888; text-align: right; white-space: nowrap; }

    .empty { padding: 4rem 2rem; text-align: center; color: #999; font-size: 1rem; }

    @media (max-width: 900px) {
        .topbar { padding: 0 1.5rem; }
        .layout { flex-direction: column; padding: 1rem; }
        .sidebar { width: 100%; position: static; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
        .sidebar .compose-btn { width: auto; padding: 0.6rem 1.2rem; margin-bottom: 0; }
        .sidebar .nav-item { margin-bottom: 0; padding: 0.5rem 0.8rem; }
        .sidebar .side-title, .sidebar .back-link { display: none; }
        .mail-row { grid-template-columns: 10rem 1fr 6rem; padding: 0.7rem 1rem; }
        .mail-row .read-stat { display: none; }
    }
    @media (max-width: 600px) {
        .topbar-left .system-name-big { display: none; }
        .mail-row { grid-template-columns: 1fr 5.5rem; }
        .mail-row .to { display: none; }
        .mail-row .time { font-size: 0.75rem; }
    }
</style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left">
        <img src="assets/haigao-logo.jpg" alt="Logo">
        <div class="logo-text">
            <span class="zh">海林市高级中学校友（新海高人）</span>
            <span class="en">Hailin Senior High School Alumni Association</span>
        </div>
        <span class="system-name-big">校友电子邮件系统</span>
    </div>
    <div class="topbar-user">
        <div class="user-avatar" id="userAvatar">—</div>
        <span id="userName">—</span>
    </div>
</header>

<div class="layout">
    <aside class="sidebar">
        <a href="mail-compose.html" class="compose-btn">写信</a>
        <a href="mail-inbox.html" class="nav-item">收件箱<span class="badge" id="inboxBadge" style="display:none">0</span></a>
        <a href="mail-sent.html" class="nav-item active">已发送</a>
        <div class="side-title">通讯录</div>
        <a href="mail-contact.html" class="nav-item">个人通讯录</a>
        <a href="member.html" class="back-link">← 返回内网</a>
    </aside>

    <div class="main">
        <div class="mail-header">
            <h2>已发送</h2>
            <button class="tool" onclick="loadSent()">刷新</button>
        </div>
        <div id="mailList"></div>
    </div>
</div>

<script>
const API_BASE_URL = 'https://hailin-alumni-api.onrender.com';
const token = localStorage.getItem('alumniToken');
if (!token) { location.href = 'login.html?redirect=mail-inbox.html'; }

function authHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (localStorage.getItem('alumniToken') || '') };
}
function fmtTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function applyUser() {
    try {
        const u = JSON.parse(localStorage.getItem('alumniUser') || '{}');
        if (u.name) { document.getElementById('userAvatar').textContent = u.name.slice(-1); document.getElementById('userName').textContent = u.name; }
    } catch (e) {}
}
applyUser();

async function loadSent() {
    const listEl = document.getElementById('mailList');
    try {
        const resp = await fetch(API_BASE_URL + '/api/mail/sent', { headers: authHeaders() });
        const data = await resp.json();
        if (!resp.ok) { listEl.innerHTML = '<div class="empty">' + (data.message || '加载失败') + '</div>'; return; }
        const mails = data.mails || [];
        if (!mails.length) { listEl.innerHTML = '<div class="empty">还没有发送过邮件</div>'; return; }
        let html = '';
        for (const m of mails) {
            const stat = m.to_count
                ? '<span class="done">已读 ' + m.read_count + ' / ' + m.to_count + '</span>'
                : '<span>—</span>';
            html += '<a class="mail-row" href="mail-detail.html?id=' + m.id + '">'
                + '<div class="to">' + (m.to_display || '(无收件人)') + '</div>'
                + '<div class="subject-line">' + (m.subject || '(无主题)') + '</div>'
                + '<div class="read-stat">' + stat + '</div>'
                + '<div class="time">' + fmtTime(m.sent_at) + '</div></a>';
        }
        listEl.innerHTML = html;
    } catch (e) {
        listEl.innerHTML = '<div class="empty">网络异常：' + e.message + '</div>';
    }
}

// 侧栏未读 badge
async function loadBadge() {
    try {
        const resp = await fetch(API_BASE_URL + '/api/mail/unread-count', { headers: authHeaders() });
        const data = await resp.json();
        const badge = document.getElementById('inboxBadge');
        if (data.unread_count > 0) { badge.style.display = 'inline'; badge.textContent = data.unread_count; }
        else { badge.style.display = 'none'; }
    } catch (e) {}
}

loadBadge();
loadSent();
</script>
</body>
</html>
