<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校友注册 - 海林市高级中学校友（新海高人）</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: clamp(11px, 1.05vw, 14px); }
    body { font-family: "Microsoft YaHei", "微软雅黑", sans-serif; background: linear-gradient(135deg, #94070A 0%, #c41e22 40%, #e85d5d 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 3rem 2rem; }
    .register-header { display: flex; align-items: center; justify-content: center; gap: 1rem; margin: auto 0 1.5rem 0; }
    .register-header .logo-circle { height: 4rem; width: 4rem; object-fit: contain; border-radius: 50%; filter: drop-shadow(0 0.3rem 0.6rem rgba(0,0,0,0.3)); }
    .register-header .logo-text-area { display: flex; flex-direction: column; justify-content: center; color: #ffffff; white-space: nowrap; }
    .register-header .logo-text-area .zh { font-size: 1.3rem; font-weight: normal; line-height: 1.4; letter-spacing: 0.05rem; text-shadow: 0 0.2rem 0.5rem rgba(0,0,0,0.3); }
    .register-header .logo-text-area .en { font-size: 0.85rem; font-weight: normal; line-height: 1.4; margin-top: 0.1rem; opacity: 0.9; letter-spacing: 0.02rem; text-shadow: 0 0.2rem 0.5rem rgba(0,0,0,0.3); }
    .register-card { width: 100%; max-width: 46rem; background: linear-gradient(135deg, #fff5f5 0%, #ffe8e8 100%); border-radius: 0.5rem; box-shadow: 0 1rem 3rem rgba(0,0,0,0.25); padding: 2rem 3rem 2.5rem; margin-bottom: auto; }
    .tip-text { font-size: 1rem; color: #333; margin-bottom: 1.5rem; line-height: 1.8; text-align: center; }
    .form-row { display: flex; align-items: flex-start; margin-bottom: 0.5rem; }
    .form-label { flex: 0 0 8rem; text-align: right; font-size: 0.95rem; color: #333; padding-top: 0.7rem; padding-right: 1rem; }
    .form-label .required { color: #d8000c; margin-right: 0.2rem; }
    .form-input-area { flex: 1; display: flex; flex-direction: column; }
    .form-input-area input[type="text"], .form-input-area input[type="tel"], .form-input-area input[type="email"] { width: 100%; max-width: 32rem; padding: 0.7rem 0.9rem; font-size: 0.95rem; border: 1px solid #e0c8c0; border-radius: 0.3rem; outline: none; background: #ffffff; font-family: "Microsoft YaHei", "微软雅黑", sans-serif; transition: border-color 0.3s; }
    .form-input-area input:focus { border-color: #94070A; box-shadow: 0 0 0 0.15rem rgba(148,7,10,0.12); }
    .error-tip { font-size: 0.85rem; color: #d8000c; margin-top: 0.3rem; margin-bottom: 0.5rem; }
    .radio-group { display: flex; align-items: center; gap: 2rem; padding-top: 0.7rem; }
    .radio-group label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.95rem; color: #333; cursor: pointer; }
    .radio-group input[type="radio"] { accent-color: #94070A; transform: scale(1.1); cursor: pointer; }
    .captcha-row { display: flex; align-items: center; gap: 1rem; max-width: 32rem; }
    .captcha-row input { flex: 1; padding: 0.7rem 0.9rem; font-size: 0.95rem; border: 1px solid #e0c8c0; border-radius: 0.3rem; outline: none; font-family: "Microsoft YaHei", "微软雅黑", sans-serif; }
    .captcha-row input:focus { border-color: #94070A; }
    .captcha-img { font-size: 1.6rem; font-weight: bold; color: #94070A; letter-spacing: 0.3rem; font-family: "Courier New", monospace; user-select: none; cursor: pointer; display: flex; align-items: center; }
    .captcha-refresh { font-size: 0.95rem; color: #94070A; text-decoration: none; cursor: pointer; margin-left: 0.5rem; }
    .captcha-refresh:hover { text-decoration: underline; }
    .divider-line { width: 100%; max-width: 32rem; height: 1px; background: #e0c8c0; margin: 1.5rem auto; }
    .next-btn { display: block; width: 11rem; margin: 0 auto; padding: 0.8rem; font-size: 1.05rem; font-weight: normal; color: #ffffff; background: linear-gradient(135deg, #94070A 0%, #c41e22 100%); border: none; border-radius: 0.3rem; cursor: pointer; font-family: "Microsoft YaHei", "微软雅黑", sans-serif; transition: background 0.3s, box-shadow 0.3s; }
    .next-btn:hover { background: linear-gradient(135deg, #c41e22 0%, #94070A 100%); box-shadow: 0 0.4rem 1rem rgba(148,7,10,0.4); }
</style>
  <link rel="icon" href="assets/favicon.png" />
</head>
<body>

<div class="register-header">
    <img src="assets/haigao-logo.jpg" alt="Logo" class="logo-circle">
    <div class="logo-text-area">
        <span class="zh">海林市高级中学校友（新海高人）</span>
        <span class="en">Hailin Senior High School Alumni Association</span>
    </div>
</div>

<div class="register-card">
    <p class="tip-text">温馨提示：为确保本站注册校友的真实性，请您如实填写下面信息以便档案验证。</p>

    <div class="form-row">
        <div class="form-label"><span class="required">*</span>真实姓名</div>
        <div class="form-input-area">
            <input type="text" id="realName">
            <div class="error-tip">请输入您的真实姓名</div>
        </div>
    </div>

    <div class="form-row">
        <div class="form-label"><span class="required">*</span>所在地区</div>
        <div class="form-input-area">
            <div class="radio-group">
                <label><input type="radio" name="region" value="domestic" checked> 国内</label>
                <label><input type="radio" name="region" value="overseas"> 国外</label>
            </div>
        </div>
    </div>

    <div class="form-row">
        <div class="form-label"><span class="required">*</span>手机</div>
        <div class="form-input-area">
            <input type="tel" id="phone">
            <div class="error-tip">请输入正确的手机号码</div>
        </div>
    </div>

    <div class="form-row">
        <div class="form-label"><span class="required">*</span>邮箱</div>
        <div class="form-input-area">
            <input type="email" id="email" autocomplete="off">
            <div class="error-tip">请输入正确的邮箱地址</div>
        </div>
    </div>

    <div class="form-row">
        <div class="form-label">验证码</div>
        <div class="form-input-area">
            <div class="captcha-row">
                <input type="text" id="captchaInput">
                <span class="captcha-img" id="captchaImg">K5oWh</span>
                <a href="javascript:void(0);" class="captcha-refresh" id="refreshCaptcha">换一张</a>
            </div>
        </div>
    </div>

    <div class="divider-line"></div>

    <button type="button" class="next-btn" id="nextBtn">下一步</button>
</div>

<script>
    const captchaImg = document.getElementById('captchaImg');
    const refreshCaptcha = document.getElementById('refreshCaptcha');
    const captchaChars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
    let captchaText = '';
    function generateCaptcha() {
        captchaText = '';
        for (let i = 0; i < 5; i++) {
            captchaText += captchaChars.charAt(Math.floor(Math.random() * captchaChars.length));
        }
        captchaImg.textContent = captchaText;
    }
    refreshCaptcha.addEventListener('click', generateCaptcha);
    captchaImg.addEventListener('click', generateCaptcha);
    generateCaptcha();

    // 第一步：校验并暂存注册信息，进入第二步
    document.getElementById('nextBtn').addEventListener('click', () => {
        const name = document.getElementById('realName').value.trim();
        const region = document.querySelector('input[name="region"]:checked').value;
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const captcha = document.getElementById('captchaInput').value.trim();
        if (!name) { alert('请输入您的真实姓名'); return; }
        if (!/^1\d{10}$/.test(phone)) { alert('请输入正确的11位手机号码'); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('请输入正确的邮箱地址'); return; }
        if (captcha.toLowerCase() !== captchaText.toLowerCase()) { alert('图形验证码不正确，请重新输入'); return; }
        sessionStorage.setItem('regName', name);
        sessionStorage.setItem('regRegion', region);
        sessionStorage.setItem('regPhone', phone);
        sessionStorage.setItem('regEmail', email);
        location.href = 'register-step2.html';
    });
</script>

</body>
</html>
